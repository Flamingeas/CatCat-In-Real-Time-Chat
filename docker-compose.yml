services:
  postgres:
    image: postgres:16
    container_name: catcat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catcat
    ports:
      - "5433:5432"
    volumes:
      - catcat_postgres_data:/var/lib/postgresql/data
      - ./server/script/schema-ci.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catcat-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catcat
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catcat
      JWT_SECRET: dev_super_secret_key_change_me_1234567890
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: catcat-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  catcat_postgres_data: