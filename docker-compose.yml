services:
  postgres:
    image: postgres:16
    container_name: catcat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catcat
    ports:
      - "5433:5432"
    volumes:
      - catcat_postgres_data:/var/lib/postgresql/data
      - ./server/script/schema-ci.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  mongo:
    image: mongo:7
    container_name: catcat-mongo
    ports:
      - "27018:27017"
    volumes:
      - catcat_mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catcat-backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catcat
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catcat
      JWT_SECRET: dev_super_secret_key_change_me_1234567890
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-catcat}
      CORS_ORIGINS: http://localhost:3000,tauri://localhost,https://tauri.localhost
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    container_name: catcat-frontend
    environment:
      BACKEND_HTTP_URL: http://backend:8080
      BACKEND_WS_URL: http://backend:8080/ws
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  catcat_postgres_data:
  catcat_mongo_data:
