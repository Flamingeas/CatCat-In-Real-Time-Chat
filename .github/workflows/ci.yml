name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Rust
    runs-on: self-hosted

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/catcat_ci
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 8080
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      CARGO_TERM_COLOR: always

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev postgresql-client

      - name: Start PostgreSQL with Docker
        run: |
          docker rm -f catcat-ci-postgres || true
          docker run -d \
            --name catcat-ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=catcat_ci \
            -p 5432:5432 \
            postgres:16

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d catcat_ci; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Prepare database schema
        run: psql "${DATABASE_URL}" -f script/schema-ci.sql

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run Rust tests
        run: cargo test --all-features

      - name: Build Rust project
        run: cargo build --release

  frontend:
    name: Frontend Next.js
    runs-on: self-hosted

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build