name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Rust
    runs-on: self-hosted

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/catcat_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/catcat_ci
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 8080
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      CARGO_TERM_COLOR: always

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev postgresql-client

      - name: Start PostgreSQL with Docker
        run: |
          docker rm -f catcat-ci-postgres || true
          docker run -d \
            --name catcat-ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=catcat_ci \
            -p 5432:5432 \
            postgres:16

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d catcat_ci; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Prepare database schema
        run: psql "${DATABASE_URL}" -f script/schema-ci.sql

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Install cargo-tarpaulin
        run: |
          if ! command -v cargo-tarpaulin >/dev/null 2>&1; then
            cargo install cargo-tarpaulin
          fi

      - name: Run tests and publish Rust coverage
        run: cargo tarpaulin --all-features --out Html --out Xml --output-dir coverage -- --test-threads=1

      - name: Publish Rust coverage summary
        run: |
          echo "## Rust test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f coverage/cobertura.xml ]; then
            COVERAGE=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("coverage/cobertura.xml")
          root = tree.getroot()

          line_rate = float(root.attrib.get("line-rate", 0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0)) * 100

          print(f"| Metric | Value |")
          print(f"|---|---:|")
          print(f"| Line coverage | {line_rate:.2f}% |")
          print(f"| Branch coverage | {branch_rate:.2f}% |")
          PY
          )
            echo "$COVERAGE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report generated, but cobertura.xml was not found." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The full HTML/XML coverage report is available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: server/coverage/

      - name: Build Rust project
        run: cargo build --release

  frontend:
    name: Frontend Next.js
    runs-on: self-hosted

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  desktop:
    name: Build Desktop App Linux (release only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Node dependencies
        run: npm ci
        working-directory: client

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        with:
          projectPath: ./client

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-app
          path: |
            **/bundle/appimage/*.AppImage
            **/bundle/deb/*.deb
  docker:
    name: Build and publish Docker images
    runs-on: self-hosted
    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Define Docker image tags
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LOWER}/${REPO_LOWER}/backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LOWER}/${REPO_LOWER}/frontend" >> "$GITHUB_ENV"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
            echo "FRONTEND_API_URL=https://catcat-backend.onrender.com" >> "$GITHUB_ENV"
            echo "FRONTEND_WS_URL=wss://catcat-backend.onrender.com/ws" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "FRONTEND_API_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
            echo "FRONTEND_WS_URL=ws://127.0.0.1:8080/ws" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Build backend Docker image
        run: |
          docker build \
            -t "$BACKEND_IMAGE:$IMAGE_TAG" \
            ./server

          if [[ "$PUSH_LATEST" == "true" ]]; then
            docker tag "$BACKEND_IMAGE:$IMAGE_TAG" "$BACKEND_IMAGE:latest"
          fi

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$FRONTEND_API_URL" \
            --build-arg NEXT_PUBLIC_WS_URL="$FRONTEND_WS_URL" \
            -t "$FRONTEND_IMAGE:$IMAGE_TAG" \
            ./client

          if [[ "$PUSH_LATEST" == "true" ]]; then
            docker tag "$FRONTEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:latest"
          fi

      - name: Push backend Docker image
        run: |
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"

          if [[ "$PUSH_LATEST" == "true" ]]; then
            docker push "$BACKEND_IMAGE:latest"
          fi

      - name: Push frontend Docker image
        run: |
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

          if [[ "$PUSH_LATEST" == "true" ]]; then
            docker push "$FRONTEND_IMAGE:latest"
          fi