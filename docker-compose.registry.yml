services:
  postgres:
    image: postgres:16
    container_name: catcat-postgres-registry
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catcat
    ports:
      - "5434:5432"
    volumes:
      - catcat_postgres_registry_data:/var/lib/postgresql/data
      - ./server/script/schema-ci.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    image: ghcr.io/epitechmscpropromo2028/t-dev-600-par_12/backend:${IMAGE_TAG:-latest}
    container_name: catcat-backend-registry
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catcat
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catcat
      JWT_SECRET: dev_super_secret_key_change_me_1234567890
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      CORS_ORIGINS: http://localhost:3001
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/epitechmscpropromo2028/t-dev-600-par_12/frontend:${IMAGE_TAG:-latest}
    container_name: catcat-frontend-registry
    environment:
      BACKEND_HTTP_URL: http://backend:8080
      BACKEND_WS_URL: http://backend:8080/ws
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  catcat_postgres_registry_data:
