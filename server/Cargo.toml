[package]
name = "rtc_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
actix = "0.13"
sqlx = { version = "0.8.2", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
bcrypt = "0.18.0"  # Pour hasher les mots de passe
validator = { version = "0.20.0", features = ["derive"] }
dotenv = "0.15"
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
env_logger = "0.11.8"
log = "0.4.29"
actix-cors = "0.7.1"
mongodb = "3.5.0"
config = "0.15.19"
futures-util = "0.3.31"
state = "0.6.0"
rand = "0.9.2"
actix-web-actors = "4.3"
futures = "0.3.31"
actix-service = "2.0.3"
async-trait = "0.1.89"
serde_urlencoded = "0.7.1"
awc = "3.8.1"
actix-test = "0.1.5"
dotenvy = "0.15"
utoipa = { version = "4", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6", features = ["actix-web"] }