03cVec\u003cServer\u003e, String\u003e {\n        self.repo.list_for_user(user_id).await.map_err(|e| {\n            log::error!(\"list_my_servers error: {:?}\", e);\n            \"Unable to list servers.\".to_string()\n        })\n    }\n\n    pub async fn get_username(\u0026self, user_id: Uuid) -\u003e Result\u003cString, String\u003e {\n        self.repo.get_username(user_id).await.map_err(|e| {\n            log::error!(\"get_username error: {:?}\", e);\n            \"Unable to fetch username\".to_string()\n        })\n    }\n\n    pub async fn join_by_invitation_code(\u0026self, user_id: Uuid, code: \u0026str) -\u003e Result\u003cServer, JoinServerError\u003e {\n        let code = code.trim().to_uppercase();\n        if code.len() != 8 {\n            return Err(JoinServerError::InvalidCode);\n        }\n\n        match self.repo.join_by_invitation_code(user_id, \u0026code).await {\n            Ok((server, inserted)) =\u003e {\n                if !inserted {\n                    return Err(JoinServerError::AlreadyMember);\n                }\n                Ok(server)\n            }\n            Err(sqlx::Error::RowNotFound) =\u003e Err(JoinServerError::NotFound),\n            Err(e) =\u003e {\n                log::error!(\"join_by_invitation_code error: {:?}\", e);\n                Err(JoinServerError::Db)\n            }\n        }\n    }\n\n    pub async fn leave_server(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003c(), LeaveServerError\u003e {\n        match self.repo.leave_server(server_id, user_id).await {\n            Ok((_server, deleted)) =\u003e {\n                if !deleted {\n                    return Err(LeaveServerError::AlreadyLeave);\n                }\n                Ok(())\n            }\n            Err(sqlx::Error::RowNotFound) =\u003e Err(LeaveServerError::NotFound),\n            Err(e) =\u003e {\n                log::error!(\"leave_server error: {:?}\", e);\n                Err(LeaveServerError::Db)\n            }\n        }\n    }\n\n    pub async fn update_server(\u0026self, user_id: Uuid, server_id: Uuid, payload: UpdateServer) -\u003e Result\u003cServer, String\u003e {\n        let server = self.repo.find_by_id(server_id).await.map_err(|e| {\n            log::error!(\"find_by_id error: {:?}\", e);\n            \"Server not found.\".to_string()\n        })?;\n\n        if server.owner_id != user_id {\n            return Err(\"Forbidden\".into());\n        }\n\n        self.repo.update(server_id, payload).await.map_err(|e| {\n            log::error!(\"update_server error: {:?}\", e);\n            \"Unable to update server.\".to_string()\n        })\n    }\n\n    pub async fn is_member(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003cbool, String\u003e {\n        self.repo.is_member(server_id, user_id).await.map_err(|e| {\n            log::error!(\"is_member error: {:?}\", e);\n            \"Unable to check membership.\".to_string()\n        })\n    }\n\n    pub async fn list_members(\u0026self, requester_id: Uuid, server_id: Uuid) -\u003e Result\u003cVec\u003cServerMemberResponse\u003e, String\u003e {\n        let is_member = self.repo.is_member(server_id, requester_id).await.map_err(|e| {\n            log::error!(\"list_members/is_member error: {:?}\", e);\n            \"Unable to check membership.\".to_string()\n        })?;\n\n        if !is_member {\n            return Err(\"Forbidden\".to_string());\n        }\n\n        self.repo.list_members(server_id).await.map_err(|e| {\n            log::error!(\"list_members error: {:?}\", e);\n            \"Unable to list members.\".to_string()\n        })\n    }\n\n    pub async fn delete_server(\u0026self, server_id: Uuid, owner_id: Uuid) -\u003e Result\u003c(), String\u003e {\n        self.repo.delete_server(server_id, owner_id).await.map_err(|e| {\n            log::error!(\"delete_server error: {:?}\", e);\n            \"Unable to delete server.\".to_string()\n        })\n    }\n\n    pub async fn set_role(\n        \u0026self,\n        requester_id: Uuid,\n        server_id: Uuid,\n        target_user_id: Uuid,\n        role: ServerMemberRole,\n    ) -\u003e Result\u003c(), String\u003e {\n        let server = self.repo.find_by_id(server_id).await.map_err(|_| \"Server not found\".to_string())?;\n\n        if server.owner_id != requester_id {\n            return Err(\"Forbidden\".into());\n        }\n\n        if target_user_id == server.owner_id {\n            return Err(\"Cannot change owner role\".into());\n        }\n\n        if matches!(role, ServerMemberRole::Owner) {\n            return Err(\"Cannot assign owner role\".into());\n        }\n\n        self.repo\n            .update_member_role(server_id, target_user_id, role)\n            .await\n            .map_err(|e| {\n                log::error!(\"set_role error: {:?}\", e);\n                \"Unable to update role\".to_string()\n            })\n    }\n    pub async fn get_server_owner_id(\u0026self, server_id: Uuid) -\u003e Result\u003cUuid, String\u003e {\n        let server = self.repo.find_by_id(server_id).await.map_err(|e| {\n            log::error!(\"get_server_owner_id/find_by_id error: {:?}\", e);\n            \"Server not found.\".to_string()\n        })?;\n        Ok(server.owner_id)\n    }\n    pub async fn transfer_owner(\n        \u0026self,\n        requester_id: Uuid,\n        server_id: Uuid,\n        new_owner_id: Uuid,\n    ) -\u003e Result\u003cServer, String\u003e {\n        let server = self.repo.find_by_id(server_id).await.map_err(|_| \"Server not found\".to_string())?;\n\n        if server.owner_id != requester_id {\n            return Err(\"Forbidden\".into());\n        }\n\n        if new_owner_id == server.owner_id {\n            return Err(\"Already owner\".into());\n        }\n        let is_member = self.repo.is_member(server_id, new_owner_id).await.map_err(|e| {\n            log::error!(\"transfer_owner/is_member error: {:?}\", e);\n            \"Unable to check membership\".to_string()\n        })?;\n        if !is_member {\n            return Err(\"Target is not a member\".into());\n        }\n        self.repo\n            .transfer_owner(server_id, requester_id, new_owner_id)\n            .await\n            .map_err(|e| {\n                log::error!(\"transfer_owner error: {:?}\", e);\n                \"Unable to transfer owner\".to_string()\n            })\n    }\n    pub async fn kick_member(\u0026self, requester_id: Uuid, server_id: Uuid, target_user_id: Uuid) -\u003e Result\u003c(), String\u003e {\n        let server = self.repo.find_by_id(server_id).await.map_err(|_| \"Server not found\".to_string())?;\n\n        if server.owner_id != requester_id {\n            return Err(\"Forbidden\".into());\n        }\n\n        if target_user_id == server.owner_id {\n            return Err(\"Cannot kick owner\".into());\n        }\n\n        self.repo.remove_member(server_id, target_user_id).await.map_err(|e| {\n            log::error!(\"kick_member error: {:?}\", e);\n            \"Unable to remove member\".to_string()\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_create_server_rejects_name_too_short_or_too_long() {\n        fn validate_name(name: \u0026str) -\u003e Result\u003c(), String\u003e {\n            let name = name.trim();\n            if name.len() \u003c 3 || name.len() \u003e 50 {\n                return Err(\"Server name must be between 3 and 50 characters.\".into());\n            }\n            Ok(())\n        }\n\n        assert!(validate_name(\"ab\").is_err());\n        assert!(validate_name(\"a\".repeat(51).as_str()).is_err());\n        assert!(validate_name(\"   ok   \").is_err());\n        assert!(validate_name(\"   okay   \").is_ok());\n    }\n\n    #[test]\n    fn test_join_by_invitation_code_rejects_invalid_length_and_normalizes() {\n        fn normalize_and_validate(code: \u0026str) -\u003e Result\u003cString, JoinServerError\u003e {\n            let code = code.trim().to_up ool: PgPool) -\u003e Self {\n        Self { pool }\n    }\n    pub async fn create(\n        \u0026self,\n        username: \u0026str,\n        email: \u0026str,\n        password_hash: \u0026str,\n    ) -\u003e Result\u003cUser, sqlx::Error\u003e {\n        let user = sqlx::query_as::\u003c_, User\u003e(\n            r#\"\n            INSERT INTO users (username, email, password_hash)\n            VALUES ($1, $2, $3)\n            RETURNING id, username, email, password_hash, created_at, updated_at\n            \"#,\n        )\n            .bind(username)\n            .bind(email)\n            .bind(password_hash)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(user)\n    }\n    pub async fn find_by_email(\u0026self, email: \u0026str) -\u003e Result\u003cOption\u003cUser\u003e, sqlx::Error\u003e {\n        let user = sqlx::query_as::\u003c_, User\u003e(\n            r#\"\n            SELECT id, username, email, password_hash, created_at, updated_at\n            FROM users\n            WHERE email = $1\n            \"#,\n        )\n            .bind(email)\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        Ok(user)\n    }\n    pub async fn find_by_id(\u0026self, id: Uuid) -\u003e Result\u003cOption\u003cUser\u003e, sqlx::Error\u003e {\n        let user = sqlx::query_as::\u003c_, User\u003e(\n            r#\"\n            SELECT id, username, email, password_hash, created_at, updated_at\n            FROM users\n            WHERE id = $1\n            \"#,\n        )\n            .bind(id)\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        Ok(user)\n    }\n    pub async fn find_by_username(\u0026self, username: \u0026str) -\u003e Result\u003cOption\u003cUser\u003e, sqlx::Error\u003e {\n        let user = sqlx::query_as::\u003c_, User\u003e(\n            r#\"\n            SELECT id, username, email, password_hash, created_at, updated_at\n            FROM users\n            WHERE username = $1\n            \"#,\n        )\n            .bind(username)\n            .fetch_optional(\u0026self.pool)\n            .await?;\n\n        Ok(user)\n    }\n    pub async fn email_exists(\u0026self, email: \u0026str) -\u003e Result\u003cbool, sqlx::Error\u003e {\n        let result = sqlx::query_scalar::\u003c_, bool\u003e(r#\"SELECT EXISTS(SELECT 1 FROM users WHERE email = $1)\"#)\n            .bind(email)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(result)\n    }\n    pub async fn username_exists(\u0026self, username: \u0026str) -\u003e Result\u003cbool, sqlx::Error\u003e {\n        let result =\n            sqlx::query_scalar::\u003c_, bool\u003e(r#\"SELECT EXISTS(SELECT 1 FROM users WHERE username = $1)\"#)\n                .bind(username)\n                .fetch_one(\u0026self.pool)\n                .await?;\n\n        Ok(result)\n    }\n    pub async fn update(\u0026self, user_id: Uuid, data: \u0026UpdateUser) -\u003e Result\u003cUser, sqlx::Error\u003e {\n        let current_user = self\n            .find_by_id(user_id)\n            .await?\n            .ok_or(sqlx::Error::RowNotFound)?;\n\n        let username = data.username.as_ref().unwrap_or(\u0026current_user.username);\n        let email = data.email.as_ref().unwrap_or(\u0026current_user.email);\n        let password_hash = data.password.as_ref().unwrap_or(\u0026current_user.password_hash);\n        let user = sqlx::query_as::\u003c_, User\u003e(\n            r#\"\n            UPDATE users\n            SET username = $1,\n                email = $2,\n                password_hash = $3\n            WHERE id = $4\n            RETURNING id, username, email, password_hash, created_at, updated_at\n            \"#,\n        )\n            .bind(username)\n            .bind(email)\n            .bind(password_hash)\n            .bind(user_id)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(user)\n    }\n    pub async fn update_password(\u0026self, y_scalar::\u003c_, i64\u003e(r#\"SELECT COUNT(*) FROM users\"#)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(count)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn test_repository_is_clone() {\n        fn assert_clone\u003cT: Clone\u003e() {}\n        assert_clone::\u003cUserRepository\u003e();\n    }\n\n    #[test]\n    fn test_repository_new_is_callable() {\n        fn accepts_ctor(_f: fn(PgPool) -\u003e UserRepository) {}\n        accepts_ctor(UserRepository::new);\n    }\n\n    #[test]\n    fn test_public_methods_signatures_compile() {\n        fn _sig_checks(repo: \u0026UserRepository, uid: Uuid, upd: \u0026UpdateUser) {\n            let _ = repo.find_by_id(uid);\n            let _ = repo.find_by_email(\"a@b.com\");\n            let _ = repo.find_by_username(\"name\");\n            let _ = repo.email_exists(\"a@b.com\");\n            let _ = repo.username_exists(\"name\");\n            let _ = repo.list(10, 0);\n            let _ = repo.count();\n            let _ = repo.update(uid, upd);\n            let _ = repo.delete(uid);\n            let _ = repo.update_password(uid, \"hash\");\n            let _ = repo.update_username(uid, \"newname\");\n            let _ = repo.create(\"u\", \"e\", \"p\");\n        }\n    }\n}\n","traces":[{"line":11,"address":[32489616],"length":1,"stats":{"Line":1}},{"line":14,"address":[32489712],"length":1,"stats":{"Line":0}},{"line":27,"address":[32413954],"length":1,"stats":{"Line":0}},{"line":28,"address":[32413987],"length":1,"stats":{"Line":0}},{"line":29,"address":[32414020],"length":1,"stats":{"Line":0}},{"line":30,"address":[32414048],"length":1,"stats":{"Line":0}},{"line":31,"address":[31799255],"length":1,"stats":{"Line":0}},{"line":33,"address":[32414738],"length":1,"stats":{"Line":0}},{"line":35,"address":[32406560,32406400,32406602,32406776,32406435,32407458],"length":1,"stats":{"Line":0}},{"line":43,"address":[32406670],"length":1,"stats":{"Line":0}},{"line rofile) =\u003e HttpResponse::Ok().json(profile),\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn get_user(pool: web::Data\u003cPgPool\u003e, path: web::Path\u003cUuid\u003e) -\u003e impl Responder {\n    let user_id = path.into_inner();\n    log::debug!(\"GET /users/{}\", user_id);\n\n    let service = user_service(\u0026pool);\n    match service.get_public_profile(user_id).await {\n        Ok(profile) =\u003e HttpResponse::Ok().json(profile),\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn list_users(pool: web::Data\u003cPgPool\u003e, query: web::Query\u003cPaginationQuery\u003e) -\u003e impl Responder {\n    log::debug!(\"GET /users - page: {}, per_page: {}\", query.page, query.per_page);\n\n    let service = user_service(\u0026pool);\n    match service.list_users(query.page, query.per_page).await {\n        Ok(response) =\u003e HttpResponse::Ok().json(response),\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn update_me(\n    pool: web::Data\u003cPgPool\u003e,\n    user: AuthenticatedUser,\n    data: web::Json\u003cUpdateUser\u003e,\n) -\u003e impl Responder {\n    log::debug!(\"PUT /me - User ID: {}\", user.user_id);\n\n    if let Err(e) = data.validate() {\n        return HttpResponse::BadRequest().json(serde_json::json!({\n            \"error\": \"Validation failed\",\n            \"details\": e.to_string()\n        }));\n    }\n\n    let service = user_service(\u0026pool);\n    match service.update_profile(user.user_id, data.into_inner()).await {\n        Ok(profile) =\u003e HttpResponse::Ok().json(profile),\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn delete_me(pool: web::Data\u003cPgPool\u003e, user: AuthenticatedUser) -\u003e impl Responder {\n    log::debug!(\"DELETE /me - User ID: {}\", user.user_id);\n\n    let service = user_service(\u0026pool);\n    match service.delete_user(user.user_id).await {\n        Ok(_) =\u003e HttpResponse::NoContent rror::Database)?\n            .ok_or(ServiceError::NotFound(\"User not found\".to_string()))?;\n\n        Ok(user.to_public_response())\n    }\n\n    pub async fn list_users(\u0026self, page: i64, per_page: i64) -\u003e Result\u003cUserListResponse, ServiceError\u003e {\n        let per_page = per_page.min(100).max(1);\n        let page = page.max(1);\n        let offset = (page - 1) * per_page;\n\n        let users = self\n            .repository\n            .list(per_page, offset)\n            .await\n            .map_err(ServiceError::Database)?;\n\n        let total = self\n            .repository\n            .count()\n            .await\n            .map_err(ServiceError::Database)?;\n\n        let users: Vec\u003cUserPublicResponse\u003e = users\n            .into_iter()\n            .map(|u| u.to_public_response())\n            .collect();\n\n        Ok(UserListResponse {\n            users,\n            total,\n            page,\n            per_page,\n            total_pages: (total as f64 / per_page as f64).ceil() as i64,\n        })\n    }\n\n    pub async fn update_profile(\u0026self, user_id: Uuid, mut data: UpdateUser) -\u003e Result\u003cUserResponse, ServiceError\u003e {\n        if let Some(ref username) = data.username {\n            if let Some(existing) = self\n                .repository\n                .find_by_username(username)\n                .await\n                .map_err(ServiceError::Database)?\n            {\n                if existing.id != user_id {\n                    return Err(ServiceError::Conflict(\"Username already taken\".to_string()));\n                }\n            }\n        }\n\n        if let Some(ref email) = data.email {\n            if let Some(existing) = self\n                .repository\n                .find_by_email(email)\n                .await\n                .map_err(ServiceError::Database)?\n            {\n                if existing.id != user_id {\n                    return Err(ServiceError::Conflict(\"Email already taken\".to_string()));\n                }\n            }\n        }\n\n        if let Some(ref password) = data.password {\n            let password_hash = hash_password(password).map_err(ServiceError::Internal)?;\n            data.password = Some(password_hash);\n        }\n\n        let user = self\n            .repository\n            .update(user_id, \u0026data)\n            .await\n            .map_err(ServiceError::Database)?;\n\n        Ok(user.to_response())\n    }\n\n    pub async fn delete_user(\u0026self, user_id: Uuid) -\u003e Result\u003c(), ServiceError\u003e {\n        self.repository\n            .find_by_id(user_id)\n            .await\n            .map_err(ServiceError::Database)?\n            .ok_or(ServiceError::NotFound(\"User not found\".to_string()))?;\n\n        self.repository\n            .delete(user_id)\n            .await\n            .map_err(ServiceError::Database)?;\n\n        Ok(())\n    }\n}\n\n#[derive(Debug, serde::Serialize)]\npub struct UserListResponse {\n    pub users: Vec\u003cUserPublicResponse\u003e,\n    pub total: i64,\n    pub page: i64,\n    pub per_page: i64,\n    pub total_pages: i64,\n}\n\n#[derive(Debug, thiserror::Error)]\npub enum ServiceError {\n    #[error(\"Database error: {0}\")]\n    Database(#[from] sqlx::Error),\n    #[error(\"Not found: {0}\")]\n    NotFound(String),\n    #[error(\"Conflict: {0}\")]\n    Conflict(String),\n    #[error(\"Internal error: {0}\")]\n    Internal(String),\n}\n\nfn hash_password(password: \u0026str) -\u003e Result\u003cString, String\u003e {\n    bcrypt::hash(password, bcrypt::DEFAULT_COST).map_err(|e| e.to_string())\n}\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_hash_password_returns_bcrypt_hash_and_not_plaintext() {\n        let password = \"password123\";\n        let hashed = hash_password(password).expect(\"hash_password should succeed\");\n\n        assert!(!hashed.is_empty());\n        assert_ne!(hashed, password);\n        assert!(hashed.starts_with(\"$2\"), \"expected bcrypt hash format\");\n\n        let ok = bcrypt::verify(password, \u0026hashed).expect(\"verify should succeed\");\n        assert!(ok);\n\n        let ko = bcrypt::verify(\"wrong_password\", \u0026hashed).expect(\"verify should succeed\");\n        assert!(!ko);\n    }\n\n    #[test]\n    fn test_pagination_normalization_logic_matches_service() {\n        fn normalize(page: i64, per_page: i64) -\u003e (i64, i64, i64) {\n            let per_page = per_page.min(100).max(1);\n            let page = page.max(1);\n            let offset = (page - 1) * per_page;\n            (page, per_page, offset)\n        }\n\n        assert_eq!(normalize(0, 0), (1, 1, 0));\n\n        assert_eq!(normalize(1, 500), (1, 100, 0));\n\n        assert_eq!(normalize(3, 20), (3, 20, 40));\n    }\n\n    #[test]\n    fn test_total_pages_calculation_matches_service() {\n        fn total_pages(total: i64, per_page: i64) -\u003e i64 {\n            let per_page = per_page.min(100).max(1);\n            (total as f64 / per_page as f64).ceil() as i64\n        }\n\n        assert_eq!(total_pages(0, 20), 0);\n        assert_eq!(total_pages(1, 20), 1);\n        assert_eq!(total_pages(20, 20), 1);\n        assert_eq!(total_pages(21, 20), 2);\n        assert_eq!(total_pages(200, 100), 2);\n        assert_eq!(total_pages(201, 100), 3);\n    }\n}\n","traces":[{"line":10,"address":[27098064],"length":1,"stats":{"Line":1}},{"line":14,"address":[27693027,27695006,27693280,27693139,27692992],"length":1,"stats":{"Line":0}},{"line":15,"address":[27693103,27694316,27694379,27693881,27694500,27693233,27695012,27693476,27693634,27693785],"length":1,"stats":{"Line":0}},{"line":17,"address":[27693132],"length":1,"stats":{"Line":0}},{"line":18,"address":[27693221,27693588,27693166,27693331,27693260],"length":1,"stats":{"Line":0}},{"line":19,"address":[27693833,27693762],"length":1,"stats":{"Line":0}},{"line":20,"address":[27694348,27695014,27694194,27694452,27693599,27694 _details(mut self, details: impl Into\u003cString\u003e) -\u003e Self {\n        self.details = Some(details.into());\n        self\n    }\n}\n\n#[derive(Debug)]\npub enum AppError {\n    UserNotFound,\n    EmailAlreadyExists,\n    UsernameAlreadyExists,\n    InvalidPassword,\n    InvalidCredentials,\n\n    ServerNotFound,\n    NotServerMember,\n    PermissionDenied,\n    InvalidInviteCode,\n    AlreadyServerMember,\n    OwnerCannotLeave,\n\n    ChannelNotFound,\n    InvalidChannelName,\n    MessageNotFound,\n    MessageTooLong,\n    MessageEmpty,\n\n    InvalidToken,\n    TokenExpired,\n    MissingToken,\n    Unauthorized,\n    ValidationError(String),\n    MissingField(String),\n    InvalidFormat(String),\n    DatabaseError(String),\n    ConnectionError,\n    UniqueViolation(String),\n    InternalError(String),\n    NotFound(String),\n    BadRequest(String),\n    Conflict(String),\n    TooManyRequests,\n}\n\nimpl fmt::Display for AppError {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            AppError::UserNotFound =\u003e write!(f, \"User not found\"),\n            AppError::EmailAlreadyExists =\u003e write!(f, \"This email is already in use\"),\n            AppError::UsernameAlreadyExists =\u003e write!(f, \"This username is already taken\"),\n            AppError::InvalidPassword =\u003e write!(f, \"Invalid password\"),\n            AppError::InvalidCredentials =\u003e write!(f, \"Invalid email or password\"),\n            AppError::ServerNotFound =\u003e write!(f, \"Server not found\"),\n            AppError::NotServerMember =\u003e write!(f, \"You are not a member of this server\"),\n            AppError::PermissionDenied =\u003e write!(f, \"Permission denied\"),\n            AppError::InvalidInviteCode =\u003e write!(f, \"Invalid invite code\"),\n            AppError::AlreadyServerMember =\u003e write!(f, \"You are already a member of this server\"),\n            AppError::OwnerCannotLeave =\u003e write!(f, \"The owner cannot leave the server\"),\n            AppError::ChannelNotFound =\u003e write!(f, \"Channel not found\"),\n            AppError::InvalidChannelName =\u003e write!(f, \"Invalid channel name\"),\n            AppError::MessageNotFound =\u003e write!(f, \"Message not found\"),\n            AppError::MessageTooLong =\u003e write!(f, \"Message is too long (max 2000 characters)\"),\n            AppError::MessageEmpty =\u003e write!(f, \"Message cannot be empty\"),\n            AppError::InvalidToken =\u003e write!(f, \"Invalid token\"),\n            AppError::TokenExpired =\u003e write!(f, \"Token expired\"),\n            AppError::MissingToken =\u003e write!(f, \"Missing token\"),\n            AppError::Unauthorized =\u003e write!(f, \"Unauthorized\"),\n            AppError::ValidationError(msg) =\u003e write!(f, \"Validation error: {}\", msg),\n            AppError::MissingField(field) =\u003e write!(f, \"Required field missing: {}\", field),\n            AppError::InvalidFormat(msg) =\u003e write!(f, \"Invalid format: {}\", msg),\n            AppError::DatabaseError(msg) =\u003e write!(f, \"Database error: {}\", msg),\n            AppError::ConnectionError =\u003e write!(f, \"Database connection error\"),\n            AppError::UniqueViolation(msg) =\u003e write!(f, \"Unique constraint violation: {}\", msg),\n            AppError::InternalError(msg) =\u003e write!(f, \"Internal error: {}\", msg),\n            AppError::NotFound(msg) =\u003e write!(f, \"Not found: {}\", msg),\n            AppError::BadRequest(msg) =\u003e write!(f, \"Invalid request: {}\", msg),\n            AppError::Conflict(msg) =\u003e write!(f, \"Conflict: {}\", msg),\n            AppError::TooManyRequests =\u003e write!(f, \"Too many requests, please try again later\"),\n        }\n    }\n}\n\nimpl AppError {\n    pub fn error_code(\u0026self) -\u003e \u0026str {\n        match self {\n            AppError::UserNotFound =\u003e \"USER_NOT_FOUND\",\n            AppError::EmailAlreadyExists =\u003e \"EMAIL_ALREADY_EXISTS\",\n            AppError::UsernameAlreadyExists =\u003e \"USERNAME_ALREADY_EXISTS\",\n            AppError::InvalidPassword =\u003e \"INVALID_PASSWORD\",\n            AppError::InvalidCredentials =\u003e \"INVALID_CREDENTIALS\",\n            AppError::ServerNotFound =\u003e \"SERVER_NOT_FOUND\",\n            AppError::NotServerMember =\u003e \"NOT_SERVER_MEMBER\",\n            AppError::PermissionDenied =\u003e \"PERMISSION_DENIED\",\n            AppError::InvalidInviteCode =\u003e \"INVALID_INVITE_CODE\",\n            AppError::AlreadyServerMember =\u003e \"ALREADY_SERVER_MEMBER\",\n            AppError::OwnerCannotLeave =\u003e \"OWNER_CANNOT_LEAVE\",\n            AppError::ChannelNotFound =\u003e \"CHANNEL_NOT_FOUND\",\n            AppError::InvalidChannelName =\u003e \"INVALID_CHANNEL_NAME\",\n            AppError::MessageNotFound =\u003e \"MESSAGE_NOT_FOUND\",\n            AppError::MessageTooLong =\u003e \"MESSAGE_TOO_LONG\",\n            AppError::MessageEmpty =\u003e \"MESSAGE_EMPTY\",\n            AppError::InvalidToken =\u003e \"INVALID_TOKEN\",\n            AppError::TokenExpired =\u003e \"TOKEN_EXPIRED\",\n            AppError::MissingToken =\u003e \"MISSING_TOKEN\",\n            AppError::Unauthorized =\u003e \"UNAUTHORIZED\",\n\n            AppError::ValidationError(_) =\u003e \"VALIDATION_ERROR\",\n            AppError::MissingField(_) =\u003e \"MISSING_FIELD\",\n            AppError::InvalidFormat(_) =\u003e \"INVALID_FORMAT\",\n\n            AppError::DatabaseError(_) =\u003e \"DATABASE_ERROR\",\n            AppError::ConnectionError =\u003e \"CONNECTION_ERROR\",\n            AppError::UniqueViolation(_) =\u003e \"UNIQUE_VIOLATION\",\n\n            AppError::InternalError(_) =\u003e \"INTERNAL_ERROR\",\n            AppError::NotFound(_) =\u003e \"NOT_FOUND\",\n            AppError::BadRequest(_) =\u003e \"BAD_REQUEST\",\n            AppError::Conflict(_) =\u003e \"CONFLICT\",\n            AppError::TooManyRequests =\u003e \"TOO_MANY_REQUESTS\",\n        }\n    }\n\n    pub fn status_code(\u0026self) -\u003e StatusCode {\n        match self {\n            AppError::ValidationError(_)\n            | AppError::MissingField(_)\n            | AppError::InvalidFormat(_)\n            | AppError::BadRequest(_)\n            | AppError::MessageEmpty\n            | AppError::MessageTooLong\n            | AppError::InvalidChannelName =\u003e StatusCode::BAD_REQUEST,\n            AppError::InvalidToken\n            | AppError::TokenExpired\n            | AppError::MissingToken\n            | AppError::Unauthorized\n            | AppError::InvalidCredentials\n            | AppError::InvalidPassword =\u003e StatusCode::UNAUTHORIZED,\n            AppError::PermissionDenied\n            | AppError::OwnerCannotLeave =\u003e StatusCode::FORBIDDEN,\n            AppError::UserNotFound\n            | AppError::ServerNotFound\n            | AppError::ChannelNotFound\n            | AppError::MessageNotFound\n            | AppError::NotFound(_) =\u003e StatusCode::NOT_FOUND,\n            AppError::EmailAlreadyExists\n            | AppError::UsernameAlreadyExists\n            | AppError::AlreadyServerMember\n            | AppError::UniqueViolation(_)\n            | AppError::Conflict(_) =\u003e StatusCode::CONFLICT,\n            AppError::TooManyRequests =\u003e StatusCode::TOO_MANY_REQUESTS,\n            AppError::DatabaseError(_)\n            | AppError::ConnectionError\n            | AppError::InternalError(_) =\u003e StatusCode::INTERNAL_SERVER_ERROR,\n            _ =\u003e StatusCode::INTERNAL_SERVER_ERROR,\n        }\n    }\n}\n\nimpl ResponseError for AppError {\n    fn error_response(\u0026self) -\u003e HttpResponse {\n        let status = self.status_code();\n        let error_response = ErrorResponse::new(\n            self.error_code(),\n            self.to_string()\n        );\n        if status.is_server_error() {\n            log::error!(\"[{}] {}: {:?}\", status, self.error_code(), self);\n        } else if status.is_client_error() \u0026\u0026 status != StatusCode::NOT_FOUND {\n            log::warn!(\"[{}] {}: {}\", status, self.error_code(), self);\n        }\n        HttpResponse::build(status).json(error_response)\n    }\n    fn status_code(\u0026self) -\u003e StatusCode {\n        self.status_code()\n    }\n}\n\nimpl From\u003csqlx::Error\u003e for AppError {\n    fn from(err: sqlx::Error) -\u003e Self {\n        match err {\n            sqlx::Error::RowNotFound =\u003e AppError::NotFound(\"Resource not found\".to_string()),\n            sqlx::Error::Database(db_err) =\u003e {\n                if let Some(constraint) = db_err.constraint() {\n                    AppError::UniqueViolation(constraint.to_string())\n                } else {\n                    AppError::DatabaseError(db_err.to_string())\n                }\n            }\n            _ =\u003e AppError::DatabaseError(err.to_string()),\n        }\n    }\n}\nimpl From\u003cmongodb::error::Error\u003e for AppError {\n    fn from(err: mongodb::error::Error) -\u003e Self {\n        AppError::DatabaseError(err.to_string())\n    }\n}\nimpl From\u003cvalidator::ValidationErrors\u003e for AppError {\n    fn from(err: validator::ValidationErrors) -\u003e Self {\n        AppError::ValidationError(err.to_string())\n    }\n}\nimpl From\u003cbcrypt::BcryptError\u003e for AppError {\n    fn from(err: bcrypt::BcryptError) -\u003e Self {\n        AppError::InternalError(format!(\"Password hashing error: {}\", err))\n    }\n}\nimpl From\u003cjsonwebtoken::errors::Error\u003e for AppError {\n    fn from(err: jsonwebtoken::errors::Error) -\u003e Self {\n        use jsonwebtoken::errors::ErrorKind;\n        match err.kind() {\n            ErrorKind::ExpiredSignature =\u003e AppError::TokenExpired,\n            ErrorKind::InvalidToken =\u003e AppError::InvalidToken,\n            ErrorKind::InvalidSignature =\u003e AppError::InvalidToken,\n            _ =\u003e AppError::InvalidTo \n                map.remove(\u0026user_id);\n                return 0;\n            }\n            return *v;\n        }\n        0\n    }\n    pub fn online_users(\u0026self) -\u003e HashSet\u003cUuid\u003e {\n        let map = self.inner.lock().unwrap();\n        map.keys().cloned().collect()\n    }\n}\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn connect_increments_counter_for_same_user() {\n        let hub = WsHub::new();\n        let uid = Uuid::new_v4();\n\n        assert_eq!(hub.connect(uid), 1);\n        assert_eq!(hub.connect(uid), 2);\n        assert_eq!(hub.connect(uid), 3);\n\n        let online = hub.online_users();\n        assert!(online.contains(\u0026uid));\n        assert_eq!(online.len(), 1);\n    }\n\n    #[test]\n    fn disconnect_decrements_and_removes_when_zero() {\n        let hub = WsHub::new();\n        let uid = Uuid::new_v4();\n\n        hub.connect(uid);\n        hub.connect(uid);\n\n        assert_eq!(hub.disconnect(uid), 1);\n        assert_eq!(hub.disconnect(uid), 0);\n\n        let online = hub.online_users();\n        assert!(!online.contains(\u0026uid));\n        assert_eq!(online.len(), 0);\n    }\n\n    #[test]\n    fn disconnect_unknown_user_returns_zero_and_does_not_panic() {\n        let hub = WsHub::new();\n        let uid = Uuid::new_v4();\n\n        assert_eq!(hub.disconnect(uid), 0);\n        assert_eq!(hub.online_users().len(), 0);\n    }\n\n    #[test]\n    fn online_users_returns_all_connected_users() {\n        let hub = WsHub::new();\n        let u1 = Uuid::new_v4();\n        let u2 = Uuid::new_v4();\n        let u3 = Uuid::new_v4();\n\n        hub.connect(u1);\n        hub.connect(u2);\n        hub.connect(u3);\n\n        let online = hub.online_users();\n        assert_eq!(online.len(), 3);\n        assert!(online.contains(\u0026u1));\n        assert!(online.contains(\u0026u2));\n        assert!(online.contains(\u0026u3));\n    }\n\n    #[test]\n    fn online_users_only_includes_users_with_positive_count() {\n        let hub = WsHub::new();\n        let u1 = Uuid::new_v4();\n        let u2 = Uuid::new_v4();\n\n        hub.connect(u1);\n        hub.connect(u2);\n        hub.connect(u2);\n\n        assert_eq!(hub.disconnect(u2), 1);\n        assert_eq!(hub.disconnect(u1), 0);\n\n        let online = hub.online_users();\n        assert_eq!(online.len(), 1);\n        assert!(!online.contains(\u0026u1));\n        assert!(online.contains(\u0026u2));\n    }\n\n    #[test]\n    fn disconnect_is_saturating_and_never_goes_negative() {\n        let hub = WsHub::new();\n        let uid = Uuid::new_v4();\n\n        assert_eq!(hub.disconnect(uid), 0);\n\n        hub.connect(uid);\n        assert_eq!(hub.disconnect(uid), 0);\n        assert_eq!(hub.disconnect(uid), 0);\n\n        assert!(hub.online_users().is_empty());\n    }\n}\n","traces":[{"line":11,"address":[31387360],"length":1,"stats":{"Line":6}},{"line":12,"address":[31387361],"length":1,"stats":{"Line":4}},{"line":14,"address":[31387656,31387376],"length":1,"stats":{"Line":4}},{"line":15,"address":[31387393],"length":1,"stats":{"Line":4}},{"line":16,"address":[31387509,31387450],"length":1,"stats":{"Line":2}},{"line":17,"address":[31387574,31387636],"length":1,"stats":{"Line":1}},{"line":18,"address":[31387607],"length":1,"stats":{"Line":1}},{"line":20,"address":[31387098,31386752],"length":1,"stats":{"Line":1}},{"line":21,"address":[31386769],"length":1,"stats":{"Line":2}},{"line":22,"address":[31386826,31386885],"length":1,"stats":{"Line":3}},{"line":23,"address":[31386953,31387004],"length":1,"stats":{"Line":2}},{"line":24,"address":[31387007],"length":1,"stats":{"Line":2}},{"line":25,"address":[31387033,31387067],"length":1,"stats":{"Line":2}},{"line":26,"address":[31387074],"length":1,"stats":{"Line":2}},{"line":28,"address":[31387018],"length":1,"stats":{"Line":1}},{"line":30,"address":[31386973],"length":1,"stats":{"Line":1}},{"line":32,"address":[31387120,31387339,31387333],"length":1,"stats":{"Line": me: String, channel_id: Uuid, content: String },\n\n    BroadcastNewMessage {\n        server_id: Uuid,\n        channel_id: Uuid,\n        message_id: Uuid,\n        user_id: Uuid,\n        username: String,\n        content: String,\n        created_at: String,\n    },\n\n    BroadcastMessageDeleted {\n        server_id: Uuid,\n        channel_id: Uuid,\n        message_id: Uuid,\n    },\n\n    StatusChange { user_id: Uuid, username: String, status: UserStatus, server_id: Option\u003cUuid\u003e },\n}\n\n#[derive(Message)]\n#[rtype(result = \"()\")]\npub enum ServerEvent {\n    ServerDeleted { server_id: Uuid },\n    MemberJoined { server_id: Uuid, user_id: Uuid, username: String },\n    MemberLeft { server_id: Uuid, user_id: Uuid, username: String },\n    MemberRoleUpdated { server_id: Uuid, user_id: Uuid, username: String, role: String },\n    MemberKicked { server_id: Uuid, user_id: Uuid, username: String },\n}\n\npub struct WsServer {\n    sessions: HashMap\u003cUuid, HashSet\u003cRecipient\u003cOutgoingMessage\u003e\u003e\u003e,\n    usernames: HashMap\u003cUuid, String\u003e,\n\n    server_rooms: HashMap\u003cUuid, HashSet\u003cUuid\u003e\u003e,\n    channel_rooms: HashMap\u003cUuid, HashSet\u003cUuid\u003e\u003e,\n}\n\nimpl WsServer {\n    pub fn new() -\u003e Self {\n        Self {\n            sessions: HashMap::new(),\n            usernames: HashMap::new(),\n            server_rooms: HashMap::new(),\n            channel_rooms: HashMap::new(),\n        }\n    }\n\n    fn send_to(\u0026self, user_id: Uuid, msg: OutgoingMessage) {\n        if let Some(addrs) = self.sessions.get(\u0026user_id) {\n            for addr in addrs {\n                let _ = addr.do_send(msg.clone());\n            }\n        }\n    }\n\n    fn broadcast_to_server_except(\u0026self, server_id: Uuid, except_user_id: Uuid, msg: OutgoingMessage) {\n        if let Some(members) = self.server_rooms.get(\u0026server_id) {\n            for uid in members {\n                if *uid == except_user_id {\n                    continue;\n                }\n                self.send_to(*uid, msg.clone());\n            }\n        }\n    }\n\n    fn broadcast_to_channel(\u0026self, channel_id: Uuid, msg: OutgoingMessage) {\n        if let Some(members) = self.channel_rooms.get(\u0026channel_id) {\n            for uid in members {\n                self.send_to(*uid, msg.clone());\n            }\n        }\n    }\n\n    fn broadcast_to_server(\u0026self, server_id: Uuid, msg: OutgoingMessage) {\n        if let Some(members) = self.server_rooms.get(\u0026server_id) {\n            for uid in members {\n                self.send_to(*uid, msg.clone());\n            }\n        }\n    }\n\n    fn username_of(\u0026self, user_id: Uuid) -\u003e String {\n        self.usernames\n            .get(\u0026user_id)\n            .cloned()\n            .unwrap_or_else(|| \"unknown\".into())\n    }\n}\n\nimpl Actor for WsServer {\n    type Context = Context\u003cSelf\u003e;\n}\n\nimpl Handler\u003cConnect\u003e for WsServer {\n    type Result = ();\n\n    fn handle(\u0026mut self, msg: Connect, _: \u0026mut Context\u003cSelf\u003e) {\n        self.sessions.entry(msg.user_id).or_default().insert(msg.addr);\n        self.usernames.insert(msg.user_id, msg.username.clone());\n\n        for server_id in msg.server_ids {\n            self.server_rooms.entry(server_id).or_default().insert(msg.user_id);\n        }\n\n        self.send_to(\n            msg.user_id,\n            OutgoingMessage::Authed {\n                user_id: msg.user_id,\n                username: msg.username,\n            },\n        );\n    }\n}\n\nimpl Handler\u003cDisconnect\u003e for WsServer {\n    type Result = ();\n\n    fn handle(\u0026mut self, msg: Disconnect, _: \u0026mut Context\u003cSelf\u003e) {\n        let mut removed_last_session = false;\n\n        if let Some(set) = self.sessions.get_mut(\u0026msg.user_id) {\n            set.remove(\u0026msg.addr);\n            if set.is_empty() {\n                self.sessions.remove(\u0026msg.user_id);\n                removed_last_session = true;\n            }\n        }\n\n        if removed_last_session {\n            let username = self.usernames.get(\u0026msg.user_id).cloned().unwrap_or_else(|| \"unknown\".into());\n\n            let servers_to_notify: Vec\u003cUuid\u003e = self\n                .server_rooms\n                .iter()\n                .filter_map(|(sid, members)| if members.contains(\u0026msg.user_id) { Some(*sid) } else { None })\n                .collect();\n\n            for sid in servers_to_notify {\n                if let Some(members) = self.server_rooms.get_mut(\u0026sid) {\n                    members.remove(\u0026msg.user_id);\n                }\n\n                self.broadcast_to_server(\n                    sid,\n                    OutgoingMessage::UserDisconnected {\n                        server_id: sid,\n                        user_id: msg.user_id,\n                        username: username.clone(),\n                    },\n                );\n            }\n\n            for (_, members) in self.channel_rooms.iter_mut() {\n                members.remove(\u0026msg.user_id);\n            }\n\n            self.usernames.remove(\u0026msg.user_id);\n        }\n    }\n}\n\nimpl Handler\u003cClientMessage\u003e for WsServer {\n    type Result = ();\n\n    fn handle(\u0026mut self, msg: ClientMessage, _: \u0026mut Context\u003cSelf\u003e) {\n        match msg {\n            ClientMessage::JoinServer { user_id, server_id } =\u003e {\n                self.server_rooms.entry(server_id).or_default().insert(user_id);\n\n                let username = self.username_of(user_id);\n\n                self.broadcast_to_server_except(\n                    server_id,\n                    user_id,\n                    OutgoingMessage::UserConnected {\n                        server_id,\n                        user_id,\n                        username: username.clone(),\n                        status: UserStatus::Online,\n                    },\n                );\n\n                let online: Vec\u003c(Uuid, String)\u003e = self\n                    .server_rooms\n                    .get(\u0026server_id)\n                    .into_iter()\n                    .flat_map(|set| set.iter())\n                    .map(|uid| (*uid, self.username_of(*uid)))\n                    .collect();\n\n                self.send_to(user_id, OutgoingMessage::PresenceSnapshot { server_id, online });\n            }\n\n            ClientMessage::LeaveServer { user_id, server_id } =\u003e {\n                if let Some(set) = self.server_rooms.get_mut(\u0026server_id) {\n                    set.remove(\u0026user_id);\n                }\n\n                let username = self.username_of(user_id);\n\n                self.broadcast_to_server_except(\n                    server_id,\n                    user_id,\n                    OutgoingMessage::UserDisconnected {\n                        server_id,\n                        user_id,\n                        username,\n                    },\n                );\n            }\n\n            ClientMessage::JoinChannel { user_id, channel_id } =\u003e {\n                self.channel_rooms.entry(channel_id).or_default().insert(user_id);\n            }\n\n            ClientMessage::LeaveChannel { user_id, channel_id } =\u003e {\n                if let Some(set) = self.channel_rooms.get_mut(\u0026channel_id) {\n                    set.remove(\u0026user_id);\n                }\n            }\n\n            ClientMessage::Typing { user_id, username, channel_id } =\u003e {\n                self.broadcast_to_channel(\n                    channel_id,\n                    OutgoingMessage::UserTyping {\n                        channel_id,\n                        user_id,\n                        username,\n                    },\n                );\n            }\n\n            ClientMessage::SendMessage { user_id, username, channel_id, content } =\u003e {\n                let message_id = Uuid::new_v4();\n                let created_at = chrono::Utc::now().to_rfc3339();\n\n                self.broadcast_to_channel(\n                    channel_id,\n                    OutgoingMessage::NewMessage {\n                        message_id,\n                        channel_id,\n                        user_id,\n                        username,\n                        content,\n                        created_at,\n                    },\n                );\n            }\n\n            ClientMessage::BroadcastNewMessage {\n                server_id: _,\n                channel_id,\n                message_id,\n                user_id,\n                username,\n                content,\n                created_at,\n            } =\u003e {\n                self.broadcast_to_channel(\n                    channel_id,\n                    OutgoingMessage::NewMessage {\n                        message_id,\n                        channel_id,\n                        user_id,\n                        username,\n                        content,\n                        created_at,\n                    },\n                );\n            }\n\n            ClientMessage::BroadcastMessageDeleted {\n                server_id,\n                channel_id,\n                message_id,\n            } =\u003e {\n                self.broadcast_to_channel(\n                    channel_id,\n                    OutgoingMessage::MessageDeleted {\n                        server_id,\n                        channel_id,\n                        message_id,\n                    },\n                );\n            }\n\n            ClientMessage::StatusChange { user_id, username, status, server_id } =\u003e {\n                if let Some(server_id) = server_id {\n                    self.broadcast_to_server(\n                        server_id,\n                        OutgoingMessage::UserStatusChanged {\n                            server_id,\n                            user_id,\n                            username,\n                            status,\n                        },\n                    );\n                }\n            }\n        }\n    }\n}\n\nimpl Handler\u003cServerEvent\u003e for WsServer {\n    type Result = ();\n\n    fn handle(\u0026mut self, msg: ServerEvent, _: \u0026mut Context\u003cSelf\u003e) {\n        match msg {\n            ServerEvent::ServerDeleted { server_id } =\u003e {\n                self.broadcast_to_server(server_id, OutgoingMessage::ServerDeleted { server_id });\n                self.server_rooms.remove(\u0026server_id);\n            }\n            ServerEvent::MemberJoined { server_id, user_id, username } =\u003e {\n                self.broadcast_to_server(\n                    server_id,\n                    OutgoingMessage::ServerMemberJoined {\n                        server_id,\n                        user_id,\n                        username,\n                    },\n                );\n            }\n            ServerEvent::MemberLeft { server_id, user_id, username } =\u003e {\n                self.broadcast_to_server(\n                    server_id,\n                    OutgoingMessage::ServerMemberLeft {\n                        server_id,\n                        user_id,\n                        username,\n                    },\n                );\n            }\n            ServerEvent::MemberRoleUpdated { server_id, user_id, username, role } =\u003e {\n                self.broadcast_to_server(\n                    server_id,\n                    OutgoingMessage::ServerMemberRoleUpdated {\n                        server_id,\n                        user_id,\n                        username,\n                        role,\n                    },\n                );\n            }\n            ServerEvent::MemberKicked { server_id, user_id, username } =\u003e {\n                if let Some(set) = self.server_rooms.get_mut(\u0026server_id) {\n                    set.remove(\u0026user_id);\n                }\n\n                self.broadcast_to_server(\n                    server_id,\n                    OutgoingMessage::ServerMemberKicked {\n                        server_id,\n                        user_id,\n                        username,\n                    },\n                );\n            }\n        }\n    }\n}\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use actix::{Actor, System};\n    use std::sync::{Arc, Mutex};\n\n    struct TestClient {\n        inbox: Arc\u003cMutex\u003cVec\u003cOutgoingMessage\u003e\u003e\u003e,\n    }\n\n    impl Actor for TestClient {\n        type Context = Context\u003cSelf\u003e;\n    }\n\n    impl Handler\u003cOutgoingMessage\u003e for TestClient {\n        type Result = ();\n\n        fn handle(\u0026mut self, msg: OutgoingMessage, _: \u0026mut Context\u003cSelf\u003e) {\n            self.inbox.lock().unwrap().push(msg);\n        }\n    }\n\n    fn client() -\u003e (Recipient\u003cOutgoingMessage\u003e, Arc\u003cMutex\u003cVec\u003cOutgoingMessage\u003e\u003e\u003e) {\n        let inbox = Arc::new(Mutex::new(Vec::\u003cOutgoingMessage\u003e::new()));\n        let addr = TestClient { inbox: inbox.clone() }.start();\n        (addr.recipient(), inbox)\n    }\n\n    fn take(inbox: \u0026Arc\u003cMutex\u003cVec\u003cOutgoingMessage\u003e\u003e\u003e) -\u003e Vec\u003cOutgoingMessage\u003e {\n        std::mem::take(\u0026mut *inbox.lock().unwrap())\n    }\n\n    #[actix::test]\n    async fn test_connect_sends_authed() {\n        let ws = WsServer::new().start();\n\n        let user_id = Uuid::new_v4();\n        let (addr, inbox) = client();\n\n        ws.do_send(Connect {\n            user_id,\n            username: \"alice\".to_string(),\n            addr,\n            server_ids: vec![],\n        });\n\n        actix::clock::sleep(std::time::Duration::from_millis(20)).await;\n\n        let msgs = take(\u0026inbox);\n        assert!(msgs.iter().any(|m| ma     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
</body>
</html>
