<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

;\nuse std::pin::Pin;\nuse uuid::Uuid;\n\nuse crate::utils::jwt::verify_token;\n\npub struct AuthMiddleware {\n    jwt_secret: String,\n}\nimpl AuthMiddleware {\n    pub fn new(jwt_secret: String) -\u003e Self {\n        Self { jwt_secret }\n    }\n}\nimpl\u003cS, B\u003e Transform\u003cS, ServiceRequest\u003e for AuthMiddleware\nwhere\n    S: Service\u003cServiceRequest, Response = ServiceResponse\u003cB\u003e, Error = Error\u003e + 'static,\n    B: 'static,\n{\n    type Response = ServiceResponse\u003cB\u003e;\n    type Error = Error;\n    type Transform = AuthMiddlewareService\u003cS\u003e;\n    type InitError = ();\n    type Future = Ready\u003cResult\u003cSelf::Transform, Self::InitError\u003e\u003e;\n\n    fn new_transform(\u0026self, service: S) -\u003e Self::Future {\n        ready(Ok(AuthMiddlewareService {\n            service,\n            jwt_secret: self.jwt_secret.clone(),\n        }))\n    }\n}\n\npub struct AuthMiddlewareService\u003cS\u003e {\n    service: S,\n    jwt_secret: String,\n}\n\nimpl\u003cS, B\u003e Service\u003cServiceRequest\u003e for AuthMiddlewareService\u003cS\u003e\nwhere\n    S: Service\u003cServiceRequest, Response = ServiceResponse\u003cB\u003e, Error = Error\u003e + 'static,\n    B: 'static,\n{\n    type Response = ServiceResponse\u003cB\u003e;\n    type Error = Error;\n    type Future = LocalBoxFuture\u003c'static, Result\u003cSelf::Response, Self::Error\u003e\u003e;\n\n    forward_ready!(service);\n\n    fn call(\u0026self, req: ServiceRequest) -\u003e Self::Future {\n        let token = match req\n            .headers()\n            .get(actix_web::http::header::AUTHORIZATION)\n            .and_then(|h| h.to_str().ok())\n        {\n            Some(value) =\u003e {\n                if let Some(t) = value.strip_prefix(\"Bearer \") {\n                    t.to_string()\n                } else {\n                    return Box::pin(async move {\n                        Err(actix_web::error::ErrorUnauthorized(\n    })\n    }\n}\n#[derive(Clone)]\npub struct AuthenticatedUser {\n    pub user_id: Uuid,\n    pub email: String,\n    pub username: Option\u003cString\u003e,\n}\n\nimpl actix_web::FromRequest for AuthenticatedUser {\n    type Error = Error;\n    type Future = Pin\u003cBox\u003cdyn std::future::Future\u003cOutput = Result\u003cSelf, Self::Error\u003e\u003e\u003e\u003e;\n\n    fn from_request(req: \u0026actix_web::HttpRequest, _payload: \u0026mut actix_web::dev::Payload) -\u003e Self::Future {\n        let req = req.clone();\n        Box::pin(async move {\n            req.extensions()\n                .get::\u003cAuthenticatedUser\u003e()\n                .cloned()\n                .ok_or_else(|| actix_web::error::ErrorUnauthorized(\"User not found in request.\"))\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use actix_service::Service;\n    use actix_web::{http::StatusCode, test, web, App, HttpResponse};\n    use crate::utils::jwt::generate_token;\n\n    async fn test_route(user: AuthenticatedUser) -\u003e HttpResponse {\n        HttpResponse::Ok().json(serde_json::json!({\n            \"user_id\": user.user_id.to_string(),\n            \"email\": user.email,\n        }))\n    }\n\n    #[actix_web::test]\n    async fn test_middleware_with_valid_token() {\n        let user_id = Uuid::new_v4();\n        let email = \"test@example.com\";\n        let secret = \"BonBon1234\";\n        let token = generate_token(user_id, email, Some(\"testuser\"), secret, 3600).unwrap();\n\n        let app = test::init_service(\n            App::new().service(\n                web::resource(\"/test\")\n                    .wrap(AuthMiddleware::new(secret.to_string()))\n                    .route(web::get().to(test_route)),\n            ),\n        )\n            .await;\n\n        let req = test::TestRequest::get()\n            .uri(\"/test\")\n            .insert_header((\"Authorization\", format!(\"Bearer {}\", token)))\n            .to_request();\n\n n}\n\npub struct AuthService {\n    user_repo: std::sync::Arc\u003cdyn UserRepo\u003e,\n    jwt_secret: String,\n}\n\nimpl AuthService {\n    pub fn new(user_repo: UserRepository, jwt_secret: String) -\u003e Self {\n        Self {\n            user_repo: std::sync::Arc::new(user_repo),\n            jwt_secret,\n        }\n    }\n\n    pub fn new_with_repo(user_repo: std::sync::Arc\u003cdyn UserRepo\u003e, jwt_secret: String) -\u003e Self {\n        Self { user_repo, jwt_secret }\n    }\n\n    pub async fn signup(\u0026self, data: CreateUser) -\u003e Result\u003c(UserResponse, String), String\u003e {\n        let email = data.email.trim().to_lowercase();\n        let username = data.username.trim().to_string();\n\n        if username.len() \u003c 3 {\n            return Err(\"Username must be at least 3 characters\".to_string());\n        }\n\n        if let Ok(Some(_)) = self.user_repo.find_by_email(\u0026email).await {\n            return Err(\"Email already exists\".to_string());\n        }\n        if let Ok(Some(_)) = self.user_repo.find_by_username(\u0026username).await {\n            return Err(\"Username already exists\".to_string());\n        }\n\n        let password_hash = hash(\u0026data.password, BCRYPT_COST).map_err(|_| \"Failed to hash password\")?;\n\n        let user = self\n            .user_repo\n            .create(\u0026username, \u0026email, \u0026password_hash)\n            .await\n            .map_err(|e| format!(\"Database error: {}\", e))?;\n\n        let token = generate_token(user.id, \u0026user.email, Some(\u0026user.username), \u0026self.jwt_secret, 86400)\n            .map_err(|_| \"Failed to create token\")?;\n\n        let response = UserResponse {\n            id: user.id,\n            username: user.username,\n            email: user.email,\n            created_at: user.created_at,\n            updated_at: user.updated_at,\n        };\n\n        Ok((response, token))\n    }\n\n    pub async fn login(\u0026self, email: String, password: String) -\u003e Result\u003c(UserResponse, String), String\u003e {\n        let email = email.trim().to_lowercase();\n\n        let user = self\n            .user_repo\n            .find_by_email(\u0026email)\n            .await\n            .map_err(|e| format!(\"Database error: {}\", e))?\n            .ok_or(\"Invalid credentials\")?;\n\n        let is_valid = verify(\u0026password, \u0026user.password_hash).map_err(|_| \"Failed to verify password\")?;\n\n        if !is_valid {\n            return Err(\"Invalid credentials\".to_string());\n        }\n\n        let token = generate_token(user.id, \u0026user.email, Some(\u0026user.username), \u0026self.jwt_secret, 86400)\n            .map_err(|_| \"Failed to create token\")?;\n\n        let response = UserResponse {\n            id: user.id,\n            username: user.username,\n            email: user.email,\n            created_at: user.created_at,\n            updated_at: user.updated_at,\n        };\n\n        Ok((response, token))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use chrono::Utc;\n    use std::collections::HashMap;\n    use std::sync::{Arc, Mutex};\n    use uuid::Uuid;\n\n    #[derive(Default)]\n    struct MockUserRepo {\n        by_email: Mutex\u003cHashMap\u003cString, User\u003e\u003e,\n        by_username: Mutex\u003cHashMap\u003cString, User\u003e\u003e,\n        create_should_fail: Mutex\u003cbool\u003e,\n        find_by_email_should_fail: Mutex\u003cbool\u003e,\n        find_by_username_should_fail: Mutex\u003cbool\u003e,\n    }\n\n    impl MockUserRepo {\n        fn insert_user(\u0026self, user: User) {\n            self.by_email\n                .lock()\n                .unwrap()\n                .insert(user.email.to_lowercase(), user.clone());\n            self.by_username\n                .lock()\n                .unwrap()\n                .insert(user.username.clone(), user);\n        }\n\n        fn set_create_fail(\u0026self, v: bool) {\n            *self.create         .bind(channel_id)\n            .bind(name)\n            .fetch_one(\u0026self.pool)\n            .await\n    }\n\n    pub async fn delete(\u0026self, channel_id: Uuid) -\u003e Result\u003c(), sqlx::Error\u003e {\n        let res = sqlx::query!(r#\"DELETE FROM channels WHERE id = $1\"#, channel_id)\n            .execute(\u0026self.pool)\n            .await?;\n\n        if res.rows_affected() == 0 {\n            return Err(sqlx::Error::RowNotFound);\n        }\n\n        Ok(())\n    }\n\n    pub async fn user_is_member(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003cbool, String\u003e {\n        let exists = sqlx::query_scalar!(\n            r#\"\n            SELECT EXISTS (\n                SELECT 1\n                FROM server_members\n                WHERE server_id = $1\n                  AND user_id = $2\n            )\n            \"#,\n            server_id,\n            user_id\n        )\n            .fetch_one(\u0026self.pool)\n            .await\n            .map_err(|e| {\n                log::error!(\"user_is_member error: {:?}\", e);\n                \"DB error\".to_string()\n            })?;\n\n        Ok(exists.unwrap_or(false))\n    }\n\n    pub async fn user_can_manage_channels(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003cbool, String\u003e {\n        let allowed = sqlx::query_scalar!(\n            r#\"\n            SELECT EXISTS (\n                SELECT 1\n                FROM server_members\n                WHERE server_id = $1\n                  AND user_id = $2\n                  AND role IN ('owner', 'admin')\n            )\n            \"#,\n            server_id,\n            user_id\n        )\n            .fetch_one(\u0026self.pool)\n            .await\n            .map_err(|e| {\n                log::error!(\"user_can_manage_channels error: {:?}\", e);\n                \"DB error\".to_string()\n            })?;\n\n        Ok(allowed.unwrap_or(false))\n    }\n\n    pub async fn user_can_manage_chan .json(channels),\n        Err(e) if e == \"Forbidden\" =\u003e HttpResponse::Forbidden().json(json!({ \"error\": \"Forbidden\" })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\npub async fn channel_update(\n    user: AuthenticatedUser,\n    service: web::Data\u003cChannelService\u003e,\n    path: web::Path\u003cUuid\u003e,\n    payload: web::Json\u003cUpdateChannel\u003e,\n) -\u003e impl Responder {\n    if let Err(e) = payload.validate() {\n        return HttpResponse::BadRequest().json(json!({ \"error\": e.to_string() }));\n    }\n\n    let channel_id = path.into_inner();\n\n    match service.update_channel(channel_id, payload.into_inner(), user.user_id).await {\n        Ok(channel) =\u003e HttpResponse::Ok().json(ChannelResponse::from(channel)),\n        Err(e) if e == \"Forbidden\" =\u003e HttpResponse::Forbidden().json(json!({ \"error\": \"Forbidden\" })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\npub async fn channel_delete(\n    user: AuthenticatedUser,\n    service: web::Data\u003cChannelService\u003e,\n    path: web::Path\u003cUuid\u003e,\n) -\u003e impl Responder {\n    let channel_id = path.into_inner();\n\n    match service.delete_channel(channel_id, user.user_id).await {\n        Ok(_) =\u003e HttpResponse::Ok().json(json!({\n            \"message\": \"Channel supprimé avec succès\"\n        })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\npub fn config_in_servers_scope(cfg: \u0026mut web::ServiceConfig) {\n    cfg.route(\"/{serverId}/channels\", web::post().to(create_channel))\n        .route(\"/{serverId}/channels\", web::get().to(channel_list));\n}\n\npub fn config_root(cfg: \u0026mut web::ServiceConfig) {\n    cfg.route(\"/channels/{id}\", web::put().to(channel_update))\n        .route(\"/channels/{id}\", web::delete().to(channel_delete));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use actix_web::{http::StatusCode, test, App};\n\n    fn uuid_str() -\u003e String {\n        Uuid::new_v4().to_string()\n    }\n\n    #[actix_web::test]\n    async fn test_config_in_servers_scope_route_exists_post_returns_not_404() {\n        let app = test::init_service(App::new().configure(config_in_servers_scope)).await;\n\n        let req = test::TestRequest::post()\n            .uri(\u0026format!(\"/{}/channels\", uuid_str()))\n            .set_json(serde_json::json!({ \"name\": \"general\" }))\n            .to_request();\n\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert_ne!(resp.status(), StatusCode::NOT_FOUND);\n    }\n\n    #[actix_web::test]\n    async fn test_config_in_servers_scope_route_exists_get_returns_not_404() {\n        let app = test::init_service(App::new().configure(config_in_servers_scope)).await;\n\n        let req = test::TestRequest::get()\n            .uri(\u0026format!(\"/{}/channels\", uuid_str()))\n            .to_request();\n\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert_ne!(resp.status(), StatusCode::NOT_FOUND);\n    }\n\n    #[actix_web::test]\n    async fn test_config_in_servers_scope_wrong_method_returns_404_or_405() {\n        let app = test::init_service(App::new().configure(config_in_servers_scope)).await;\n\n        let req = test::TestRequest::put()\n            .uri(\u0026format!(\"/{}/channels\", uuid_str()))\n            .to_request();\n\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert!(resp.status() == StatusCode::NOT_FOUND || resp.status() == StatusCode::METHOD_NOT_ALLOWED);\n    }\n\n    #[actix_web::test]\n    async fn test_config_root_route_exists_put_returns_not_404() {\n        let app = test::init_service(App::new().configure(config_root)).await;\n\n        let req = test::TestRequest::put()\n            .uri(\u0026format!(\"/channels/{}\", uuid_str()))\n            .set_json(serde_json::json!({ \"name\": \"new-name\" }))\n            .to_request();\n\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert_ne!(resp.status(), StatusCode::NOT_FOUND);\n    }\n\n    #[actix_web::test]\n    async fn test_config_root_route_exists_delete_returns_not_404() {\n        let app = test::init_service(App::new().configure(config_root)).await;\n\n        let req = test::TestRequest::delete()\n            .uri(\u0026format!(\"/channels/{}\", uuid_str()))\n            .to_request();\n\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert_ne!(resp.status(), StatusCode::NOT_FOUND);\n    }\n\n    #[actix_web::test]\n    async fn test_config_root_wrong_method_returns_404_or_405() {\n        let app = test::init_service(App::new().configure(config_root)).await;\n\n        let req = test::TestRequest::get()\n            .uri(\u0026format!(\"/channels/{}\", uuid_str()))\n            .to_request();\n\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert!(resp.status() == StatusCode::NOT_FOUND || resp.status() == StatusCode::METHOD_NOT_ALLOWED);\n    }\n\n    #[actix_web::test]\n    async fn test_unrelated_path_is_404() {\n        let app = test::init_service(\n            App::new()\n                .configure(config_in_servers_scope)\n                .configure(config_root),\n        )\n            .await;\n\n        let req = test::TestRequest::get().uri(\"/nope\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n\n        assert_eq!(resp.status(), StatusCode::NOT_FOUND);\n    }\n}\n","traces":[{"line":10,"address":[29971616],"length":1,"stats":{"Line":0}},{"line":16,"address":[30334110,30334007],"length":1,"stats":{"Line":0}},{"line":17,"address":[30334190,30334523,30334300,30335271,30335233,30334386],"length":1,"stats":{"Line":0}},{"line":20,"address":[30334209],"length":1,"stats":{"Line":0}},{"line":22,"address":[30334046,30335289,30335560],"length":1,"stats":{"Line":0}},{"line":23,"address":[30335994,3 :82,"address":[29971165],"length":1,"stats":{"Line":1}},{"line":83,"address":[29971223],"length":1,"stats":{"Line":1}}],"covered":6,"coverable":32},{"path":["/","home","vincent","T-DEV-600-PAR_12","server","src","modules","channel","service.rs"],"content":"use uuid::Uuid;\nuse crate::modules::channel::repository::ChannelRepository;\nuse crate::models::channel::{Channel, UpdateChannel};\n\npub struct ChannelService {\n    repo: ChannelRepository,\n}\n\nimpl ChannelService {\n    pub fn new(repo: ChannelRepository) -\u003e Self {\n        Self { repo }\n    }\n\n    pub async fn create_channel(\n        \u0026self,\n        server_id: Uuid,\n        name: \u0026str,\n        user_id: Uuid,\n    ) -\u003e Result\u003cChannel, String\u003e {\n        let name = name.trim();\n\n        if name.len() \u003c 3 || name.len() \u003e 50 {\n            return Err(\"Channel name must be between 3 and 50 characters.\".into());\n        }\n\n        if !self.repo.user_can_manage_channels(server_id, user_id).await? {\n            return Err(\"Forbidden\".into());\n        }\n\n        self.repo\n            .create(server_id, name)\n            .await\n            .map_err(|e| {\n                log::error!(\"create_channel error: {:?}\", e);\n                \"Unable to create channel.\".to_string()\n            })\n    }\n\n    pub async fn list_channel(\n        \u0026self,\n        server_id: Uuid,\n        user_id: Uuid,\n    ) -\u003e Result\u003cVec\u003cChannel\u003e, String\u003e {\n        if !self.repo.user_is_member(server_id, user_id).await? {\n            return Err(\"Forbidden\".into());\n        }\n\n        self.repo\n            .list_for_server(server_id)\n            .await\n            .map_err(|e| {\n                log::error!(\"list_channel error: {:?}\", e);\n                \"Unable to list channels.\".to_string()\n            })\n    }\n\n    pub async fn update_channel(\n        \u0026self,\n        channel_id: Uuid,\n        payload: UpdateChannel,\n        user_id: Uuid,\n    ) -\u003e Result\u003cChannel, String\u003e {\n        if !self.repo.user_can_manage_channel(channel_id, user_id).await? {\n            return Err(\"Forbidden\".into());\n        }\n\n        self.repo\n            .update(channel_id, payload)\n            .await\n            .map_err(|e| {\n                log::error!(\"update_channel error: {:?}\", e);\n                \"Unable to update channel.\".to_string()\n            })\n    }\n\n    pub async fn delete_channel(\n        \u0026self,\n        channel_id: Uuid,\n        user_id: Uuid,\n    ) -\u003e Result\u003c(), String\u003e {\n        if !self.repo.user_can_manage_channel(channel_id, user_id).await? {\n            return Err(\"Forbidden\".into());\n        }\n\n        self.repo\n            .delete(channel_id)\n            .await\n            .map_err(|e| {\n                log::error!(\"delete_channel error: {:?}\", e);\n                \"Unable to delete channel.\".to_string()\n            })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::models::channel::UpdateChannel;\n    use sqlx::PgPool;\n    use sqlx::postgres::PgPoolOptions;\n    use std::time::Duration;\n\n    async fn pool_if_available() -\u003e Option\u003cPgPool\u003e {\n        let url = std::env::var(\"DATABASE_URL\")\n            .ok()\n            .or_else(|| std::env::var(\"TEST_DATABASE_URL\").ok())?;\n\n        let pool = PgPoolOptions::new()\n            .max_connections(5)\n            .acquire_timeout(Duration::from_secs(5))\n            .connect(\u0026url)\n            .await\n            .ok()?;\n\n        Some(pool)\n    }\n\n    #[actix_web::test]\n    async fn test_create_channel_rejects_short_or_long_names() {\n        let pool = match pool_if_available().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ChannelRepository::new(pool);\n        let service = ChannelService::new(repo);\n\n        let server_id = Uuid::new_v4();\n        let user_id = Uuid::new_v4();\n\n        let err = service.create_channel(server_id, \"ab\", user_id).await.unwrap_err();\n        assert_eq!(err, \"Channel name must be between 3 and 50 characters.\");\n\n        let err = service.create_channel(server_id, \u0026\"a\".repeat(51), user_id).await.unwrap_err();\n        assert_eq!(err, \"Channel name must be between 3 and 50 characters.\");\n    }\n\n    #[actix_web::test]\n    async fn test_create_channel_trims_name_and_forbidden_if_no_permission() {\n        let pool = match pool_if_available().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ChannelRepository::new(pool);\n        let service = ChannelService::new(repo);\n\n        let server_id = Uuid::new_v4();\n        let user_id = Uuid::new_v4();\n\n        let res = service.create_channel(server_id, \"  general  \", user_id).await;\n        assert!(res.is_err());\n    }\n\n    #[actix_web::test]\n    async fn test_list_channel_forbidden_when_not_member() {\n        let pool = match pool_if_available().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ChannelRepository::new(pool);\n        let service = ChannelService::new(repo);\n\n        let server_id = Uuid::new_v4();\n        let user_id = Uuid::new_v4();\n\n        let res = service.list_channel(server_id, user_id).await;\n        assert!(res.is_err());\n    }\n\n    #[actix_web::test]\n    async fn test_update_channel_forbidden_when_cannot_manage() {\n        let pool = match pool_if_available().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ChannelRepository::new(pool);\n        let service = ChannelService::new(repo);\n\n        let channel_id = Uuid::new_v4();\n        let user_id = Uuid::new_v4();\n\n        let payload = UpdateChannel {\n            name: Some(\"new-name\".to_string()),\n        };\n\n        let err = service.update_channel(channel_id, payload, user_id).await.unwrap_err();\n        assert_eq!(err, \"Forbidden\");\n    }\n\n    #[actix_web::test]\n    async fn test_delete_channel_forbidden_when_cannot_manage() {\n        let pool = match pool_if_available().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ChannelRepository::new(pool);\n        let service = ChannelService::new(repo);\n\n        let channel_id = Uuid::new_v4();\n        let user_id = Uuid::new_v4();\n\n        let err = service.delete_channel(channel_id, user_id).await.unwrap_err();\n        assert_eq!(err, \"Forbidden\");\n    }\n}\n","traces":[{"line":10,"address":[31635008],"length":1,"stats":{"Line":0}},{"line":14,"address":[31634816],"length":1,"stats":{"Line":0}},{"line":20,"address":[26580558,26580416],"length":1,"stats":{"Line":0}},{"line":22,"address":[26580565,26580664],"length":1,"stats":{"Line":0}},{"line":23,"address":[26580621,26580809],"length":1,"stats":{"Line":0}},{"line":26,"address":[26580945,26580469,26581574,26580675],"length":1,"stats":{"Line":0}},{"line":27,"address":[26581343,26581433],"length":1,"stats":{"Line":0}},{"line":30,"address":[26581532,26581732,26581926,26581823,26581386],"length":1,"stats":{"Line":0}},{"line":31,"address":[26581390],"length":1,"stats":{"Line":0}},{"line":32,"address":[31811390],"length":1,"stats":{"Line":0}},{"line":33,"address":[26581919,26581936,26582377],"length":1,"stats":{"Line":0}},{"line":34,"address":[26581958,26582076,26582039],"length":1,"stats":{"Line":0}},{"line":35,"address":[26582050],"length":1,"stats":{"Line":0}},{"line":39,"address":[31634768],"length":1,"stats":{"Line":0}},{"line":44,"address":[26578703,26579532,26578865,26578616,26578782],"length":1,"stats":{"Line":0}},{"line":45,"address":[26579242,26579327],"length":1,"stats":{"Line":0}},{"line":48,"address":[26579685,26579489,26579815,26579285,26579744],"length":1,"stats":{"Line":0}},{"line":49,"address": ","home","vincent","T-DEV-600-PAR_12","server","src","modules","message","repository.rs"],"content":"use futures::stream::TryStreamExt;\nuse mongodb::{\n    bson::{doc, Binary},\n    bson::spec::BinarySubtype,\n    Database,\n};\nuse uuid::Uuid;\n\nuse crate::models::message::{CreateMessage, Message, UpdateMessage};\n\nfn uuid_bin0(id: Uuid) -\u003e Binary {\n    Binary {\n        subtype: BinarySubtype::Generic,\n        bytes: id.as_bytes().to_vec(),\n    }\n}\n\npub struct MessageRepository\u003c'a\u003e {\n    db: \u0026'a Database,\n}\n\nimpl\u003c'a\u003e MessageRepository\u003c'a\u003e {\n    pub fn new(db: \u0026'a Database) -\u003e Self {\n        Self { db }\n    }\n\n    fn collection(\u0026self) -\u003e mongodb::Collection\u003cMessage\u003e {\n        self.db.collection(\"channel_messages\")\n    }\n\n    pub async fn create(\n        \u0026self,\n        user_id: Uuid,\n        username: String,\n        server_id: Uuid,\n        data: CreateMessage,\n    ) -\u003e Result\u003cMessage, mongodb::error::Error\u003e {\n        let message = Message::new(\n            data.content.clone(),\n            user_id,\n            username,\n            data.channel_id,\n            server_id,\n        );\n\n        self.collection().insert_one(\u0026message).await?;\n        Ok(message)\n    }\n\n    pub async fn find_by_id(\n        \u0026self,\n        message_id: Uuid,\n    ) -\u003e Result\u003cOption\u003cMessage\u003e, mongodb::error::Error\u003e {\n        let filter = doc! {\n            \"message_id\": uuid_bin0(message_id)\n        };\n\n        self.collection().find_one(filter).await\n    }\n\n    pub async fn find_by_channel(\n        \u0026self,\n        channel_id: Uuid,\n        limit: i64,\n        before: Option\u003cchrono::DateTime\u003cchrono::Utc\u003e\u003e,\n    ) -\u003e Result\u003cVec\u003cMessage\u003e, mongodb::error::Error\u003e {\n        use mongodb::bson::DateTime as BsonDateTime;\n        use mongodb::options::FindOptions;\n\n        let mut filter = doc! {\n            \"channel_id\": uuid_bin0(channel_id),\n            \"$or\": [\n                { \"deleted_at\": { \"$exists\": false } },\n                { \"deleted_at\": null }\n            ]\n        };\n\n        if let Some(before_dt) = before {\n            let before_bson = BsonDateTime::from_millis(before_dt.timestamp_millis());\n            filter.insert(\"created_at\", doc! { \"$lt\": before_bson });\n        }\n\n        let options = FindOptions::builder()\n            .sort(doc! { \"created_at\": -1 })\n            .limit(limit)\n            .build();\n\n        let mut cursor = self\n            .collection()\n            .find(filter)\n            .with_options(options)\n            .await?;\n\n        let mut messages = Vec::new();\n        while let Some(message) = cursor.try_next().await? {\n            messages.push(message);\n        }\n\n        messages.reverse();\n        Ok(messages)\n    }\n\n    pub async fn update(\n        \u0026self,\n        message_id: Uuid,\n        data: \u0026UpdateMessage,\n    ) -\u003e Result\u003cMessage, mongodb::error::Error\u003e {\n        use mongodb::bson::DateTime as BsonDateTime;\n\n        let filter = doc! {\n            \"message_id\": uuid_bin0(message_id)\n        };\n\n        let update = doc! {\n            \"$set\": {\n                \"content\": \u0026data.content,\n                \"updated_at\": BsonDateTime::now()\n            }\n        };\n\n        let options = mongodb::options::FindOneAndUpdateOptions::builder()\n            .return_document(mongodb::options::ReturnDocument::After)\n            .build();\n\n        let message = self\n            .collection()\n            .find_one_and_update(filter, update)\n            .with_options(options)\n            .await?\n            .ok_or_else(|| {\n                mongodb::error::Error::from(std::io::Error::new(\n                    std::io::ErrorKind::NotFound,\n                    \"Message not found\",\n                ))\n            })?;\n\n        Ok(message)\n    }\n\n    pub async fn delete(\n        \u0026self,\n        message_id: Uuid,\n    ) -\u003e Result\u003c(), mongodb::error::Error\u003e {\n        use mongodb::bson::DateTime as BsonDateTime;\n\n        let filter = doc! {\n            \"message_id\": uuid_bin0(message_id)\n        };\n\n        let update = doc! {\n            \"$set\": { \"deleted_at\": BsonDateTime::now() }\n        };\n\n        self.collection().update_one(filter, update).await?;\n        Ok(())\n    }\n\n    pub async fn count_by_channel(\n        \u0026self,\n        channel_id: Uuid,\n    ) -\u003e Result\u003cu64, mongodb::error::Error\u003e {\n        let filter = doc! {\n            \"channel_id\": uuid_bin0(channel_id),\n            \"$or\": [\n                { \"deleted_at\": { \"$exists\": false } },\n                { \"deleted_at\": null }\n            ]\n        };\n\n        self.collection().count_documents(filter).await\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_uuid_bin0_binary_format() {\n        let id = Uuid::new_v4();\n        let bin = uuid_bin0(id);\n\n        assert_eq!(bin.subtype, BinarySubtype::Generic);\n        assert_eq!(bin.bytes.len(), 16);\n        assert_eq!(bin.bytes.as_slice(), id.as_bytes());\n    }\n\n    #[test]\n    fn test_filters_use_uuid_bin0_consistently() {\n        let channel_id = Uuid::new_v4();\n        let message_id = Uuid::new_v4();\n\n        let by_channel = doc! { \"channel_id\": uuid_bin0(channel_id) };\n        let by_id = doc! { \"message_id\": uuid_bin0(message_id) };\n\n        let bc = by_channel.get(\"channel_id\").unwrap();\n        let bi = by_id.get(\"message_id\").unwrap();\n\n        match (bc, bi) {\n            (\n                mongodb::bson::Bson::Binary(b1),\n                mongodb::bson::Bson::Binary(b2),\n            ) =\u003e {\n                assert_eq!(b1.subtype, BinarySubtype::Generic);\n                assert_eq!(b1.bytes.as_slice(), channel_id.as_bytes());\n\n                assert_eq!(b2.subtype, BinarySubtype::Generic);\n                assert_eq!(b2.bytes.as_slice(), message_id.as_bytes());\n            }\n            _ =\u003e panic!(\"Expected Binary BSON values\"),\n        }\n    }\n}\n","traces":[{"line":11,"address":[31005968],"length":1,"stats":{"Line":1}},{"line":14,"address":[31005995],"length":1,"stats":{"Line":2}},{"line":23,"address":[31005744],"length":1,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[31005760],"length":1,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[30871883],"length":1,"stats":{"Line":0}},{"line":50,"address":[31005600],"length":1,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[31815044],"length":1,"stats":{"Line":0}},{"line":61,"address":[31005632],"length":1,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[30862738],"length":1,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":83,"address":[30864516],"length":1,"stats":{"Line":0}},{"line":84,"address":[30865013],"length":1,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":88,"a _id: message.channel_id,\n                message_id: message.message_id,\n                user_id: message.user_id,\n                username: message.username.clone(),\n                content: message.content.clone(),\n                created_at: message.created_at.to_rfc3339(),\n            });\n\n            HttpResponse::Created().json(message)\n        }\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn get_messages(\n    pg_pool: web::Data\u003cPgPool\u003e,\n    mongo_db: web::Data\u003cDatabase\u003e,\n    user: AuthenticatedUser,\n    path: web::Path\u003cUuid\u003e,\n    query: web::Query\u003cGetMessagesQueryParams\u003e,\n) -\u003e impl Responder {\n    let channel_id = path.into_inner();\n    let limit = query.limit.unwrap_or(50).clamp(1, 100);\n\n    let service = MessageService::new(mongo_db.get_ref(), pg_pool.get_ref());\n\n    match service\n        .get_messages(user.user_id, channel_id, Some(limit), query.before)\n        .await\n    {\n        Ok(messages) =\u003e HttpResponse::Ok().json(messages),\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn update_message(\n    pg_pool: web::Data\u003cPgPool\u003e,\n    mongo_db: web::Data\u003cDatabase\u003e,\n    user: AuthenticatedUser,\n    path: web::Path\u003cUuid\u003e,\n    data: web::Json\u003cUpdateMessageRequest\u003e,\n) -\u003e impl Responder {\n    let message_id = path.into_inner();\n\n    if let Err(e) = data.validate() {\n        return HttpResponse::BadRequest().json(serde_json::json!({\n            \"error\": e.to_string()\n        }));\n    }\n\n    let service = MessageService::new(mongo_db.get_ref(), pg_pool.get_ref());\n\n    let payload = UpdateMessage {\n        content: data.content.trim().to_string(),\n    };\n\n    match service.update_message(user.user_id, message_id, payload).await {\n        Ok(message) =\u003e HttpResponse::Ok().json(message),\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\npub async fn delete_message(\n    pg_pool: web::Data\u003cPgPool\u003e,\n    mongo_db: web::Data\u003cDatabase\u003e,\n    ws_server: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    user: AuthenticatedUser,\n    path: web::Path\u003cUuid\u003e,\n) -\u003e impl Responder {\n    let message_id = path.into_inner();\n    let service = MessageService::new(mongo_db.get_ref(), pg_pool.get_ref());\n\n    match service.delete_message(user.user_id, message_id).await {\n        Ok((server_id, channel_id, message_id)) =\u003e {\n            ws_server.do_send(ClientMessage::BroadcastMessageDeleted {\n                server_id,\n                channel_id,\n                message_id,\n            });\n\n            HttpResponse::NoContent().finish()\n        }\n        Err(e) =\u003e handle_service_error(e),\n    }\n}\n\n#[derive(Debug, serde::Deserialize, Validate)]\npub struct SendMessageRequest {\n    #[validate(length(min = 1, max = 2000))]\n    pub content: String,\n}\n\n#[derive(Debug, serde::Deserialize, Validate)]\npub struct UpdateMessageRequest {\n    #[validate(length(min = 1, max = 2000))]\n    pub content: String,\n}\n\n#[derive(Debug, serde::Deserialize)]\npub struct GetMessagesQueryParams {\n    pub limit: Option\u003ci64\u003e,\n    pub before: Option\u003cchrono::DateTime\u003cchrono::Utc\u003e\u003e,\n}\n\nfn handle_service_error(error: ServiceError) -\u003e HttpResponse {\n    match error {\n        ServiceError::NotFound(msg) =\u003e {\n            HttpResponse::NotFound().json(serde_json::json!({ \"error\": msg }))\n        }\n        ServiceError::Forbidden(msg) =\u003e {\n            HttpResponse::Forbidden().json(serde_json::json!({ \"error\": msg }))\n        }\n        ServiceError::Database(_e) =\u003e HttpResponse::InternalServerError()\n            .json(serde_json::json!({ \"error\": \"Database error\" })),\n        ServiceError::Internal(_msg) =\u003e HttpResponse::InternalServerError()\n            .json(serde_json::json!({ \"error\": \"Internal error\" })),\n    }\n}\n\npub fn config(cfg: \u0026mut web::ServiceConfig) {\n    cfg.service(\n        web::scope(\"/channels\")\n            .route(\"/{channel_id}/messages\", web::post().to(send_message))\n            .route(\"/{channel_id}/messages\", web::get().to(get_messages)),\n    );\n\n    cfg.service(\n        web::scope(\"/messages\")\n            .route(\"/{id}\", web::put().to(update_message))\n            .route(\"/{id}\", web::delete().to(delete_message)),\n    );\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use actix_web::{body, http::StatusCode, test, App};\n    use serde_json::Value;\n\n    fn uuid_str() -\u003e String {\n        Uuid::new_v4().to_string()\n    }\n\n    #[test]\n    async fn test_send_message_request_validation() {\n        let ok = SendMessageRequest {\n            content: \"hello\".to_string(),\n        };\n        assert!(ok.validate().is_ok());\n\n        let bad = SendMessageRequest {\n            content: \"\".to_string(),\n        };\n        assert!(bad.validate().is_err());\n\n        let bad = SendMessageRequest {\n            content: \"a\".repeat(2001),\n        };\n        assert!(bad.validate().is_err());\n    }\n\n    #[test]\n    async fn test_update_message_request_validation() {\n        let ok = UpdateMessageRequest {\n            content: \"hello\".to_string(),\n        };\n        assert!(ok.validate().is_ok());\n\n        let bad = UpdateMessageRequest {\n            content: \"\".to_string(),\n        };\n        assert!(bad.validate().is_err());\n\n        let bad = UpdateMessageRequest {\n            content: \"a\".repeat(2001),\n        };\n        assert!(bad.validate().is_err());\n    }\n\n    #[actix_web::test]\n    async fn test_handle_service_error_status_codes_and_json_shape() {\n        let resp = handle_service_error(ServiceError::NotFound(\"x\".to_string()));\n        assert_eq!(resp.status(), StatusCode::NOT_FOUND);\n        let bytes = body::to_bytes(resp.into_body()).await.unwrap();\n        let v 03e {\n    repository: MessageRepository\u003c'a\u003e,\n    pg_pool: \u0026'a PgPool,\n}\n\nimpl\u003c'a\u003e MessageService\u003c'a\u003e {\n    pub fn new(mongo_db: \u0026'a Database, pg_pool: \u0026'a PgPool) -\u003e Self {\n        Self {\n            repository: MessageRepository::new(mongo_db),\n            pg_pool,\n        }\n    }\n\n    pub async fn send_message(\u0026self, user_id: Uuid, data: CreateMessage) -\u003e Result\u003cMessageResponse, ServiceError\u003e {\n        let (channel_exists, server_id) = sqlx::query_as::\u003c_, (bool, Option\u003cUuid\u003e)\u003e(\n            \"SELECT EXISTS(SELECT 1 FROM channels WHERE id = $1),\n                    (SELECT server_id FROM channels WHERE id = $1)\",\n        )\n            .bind(data.channel_id)\n            .fetch_one(self.pg_pool)\n            .await\n            .map_err(ServiceError::Database)?;\n\n        if !channel_exists {\n            return Err(ServiceError::NotFound(\"Channel not found\".to_string()));\n        }\n\n        let server_id = server_id.ok_or(ServiceError::NotFound(\"Channel not found\".to_string()))?;\n\n        let (is_member, username) = sqlx::query_as::\u003c_, (bool, Option\u003cString\u003e)\u003e(\n            \"SELECT\n                EXISTS(SELECT 1 FROM server_members WHERE server_id = $1 AND user_id = $2),\n                (SELECT username FROM users WHERE id = $2)\",\n        )\n            .bind(server_id)\n            .bind(user_id)\n            .fetch_one(self.pg_pool)\n            .await\n            .map_err(ServiceError::Database)?;\n\n        if !is_member {\n            return Err(ServiceError::Forbidden(\"You are not a member of this server\".to_string()));\n        }\n\n        let username = username.ok_or(ServiceError::NotFound(\"User not found\".to_string()))?;\n\n        let message = self\n            .repository\n            .create(user_id, username, server_id, data)\n            .await\n            .map_err(|e| ServiceError::Internal(e.to_string()))?;\n\n        Ok(message.to_response())\n    }\n\n    pub async fn get_messages(\n        \u0026self,\n        user_id: Uuid,\n        channel_id: Uuid,\n        limit: Option\u003ci64\u003e,\n        before: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    ) -\u003e Result\u003cVec\u003cMessageResponse\u003e, ServiceError\u003e {\n        let server_id = sqlx::query_scalar::\u003c_, Option\u003cUuid\u003e\u003e(\"SELECT server_id FROM channels WHERE id = $1\")\n            .bind(channel_id)\n            .fetch_one(self.pg_pool)\n            .await\n            .map_err(ServiceError::Database)?\n            .ok_or(ServiceError::NotFound(\"Channel not found\".to_string()))?;\n\n        let is_member = sqlx::query_scalar::\u003c_, bool\u003e(\n            \"SELECT EXISTS(SELECT 1 FROM server_members WHERE server_id = $1 AND user_id = $2)\",\n        )\n            .bind(server_id)\n            .bind(user_id)\n            .fetch_one(self.pg_pool)\n            .await\n            .map_err(ServiceError::Database)?;\n\n        if !is_member {\n            return Err(ServiceError::Forbidden(\"You are not a member of this server\".to_string()));\n        }\n\n        let limit = limit.unwrap_or(50).clamp(1, 100);\n\n        let messages = self\n            .repository\n            .find_by_channel(channel_id, limit, before)\n            .await\n            .map_err(|e| ServiceError::Internal(e.to_string()))?;\n\n        Ok(messages.into_iter().map(|m| m.to_response()).collect())\n    }\n\n    pub async fn update_message(\n        \u0026self,\n        user_id: Uuid,\n        message_id: Uuid,\n        data: UpdateMessage,\n    ) -\u003e Result\u003cMessageResponse, ServiceError\u003e {\n        let message = self\n            .repository\n            .find_by_id(message_id)\n            .await\n            .map_err(|e| ServiceError::Internal(e.to_string()))?\n            .ok_or(ServiceError::NotFound(\"Message not found\".to_string()))?;\n\n        if message.user_id != user_id {\n            return Err(ServiceError::Forbidden(\"You can only edit your own messages\".to_string()));\n        }\n\n        if message.is_deleted() {\n            return Err(ServiceError::Forbidden(\"Cannot edit a deleted message\".to_string()));\n        }\n\n        let updated_message = self\n            .repository\n            .update(message_id, \u0026data)\n            .await\n            .map_err(|e| ServiceError::Internal(e.to_string()))?;\n\n        Ok(updated_message.to_response())\n    }\n\n    pub async fn delete_message(\u0026self, user_id: Uuid, message_id: Uuid) -\u003e Result\u003c(Uuid, Uuid, Uuid), ServiceError\u003e {\n        let message = self\n            .repository\n            .find_by_id(message_id)\n            .await\n            .map_err(|e| ServiceError::Internal(e.to_string()))?\n            .ok_or(ServiceError::NotFound(\"Message not found\".to_string()))?;\n\n        if message.is_deleted() {\n            return Err(ServiceError::Forbidden(\"Cannot delete a deleted message\".to_string()));\n        }\n\n        let can_delete = if message.user_id == user_id {\n            true\n        } else {\n            let role: Option\u003cString\u003e = sqlx::query_scalar(\n                \"SELECT role::text FROM server_members WHERE server_id = $1 AND user_id = $2\",\n            )\n                .bind(message.server_id)\n                .bind(user_id)\n                .fetch_optional(self.pg_pool)\n                .await\n                .map_err(ServiceError::Database)?;\n\n            matches!(role.as_deref(), Some(\"owner\") | Some(\"admin\"))\n        };\n\n        if !can_delete {\n            return Err(ServiceError::Forbidden(\"You don't have permission to delete this message\".to_string()));\n        }\n\n        self.repository\n            .delete(message_id)\n            .await\n            .map_err(|e| ServiceError::Internal(e.to_string()))?;\n\n        Ok((message.server_id, message.channel_id, message.message_id))\n    }\n}\n\n#[derive(Debug, thiserror::Error)]\npub enum ServiceError {\n    #[error(\"Database error: {0}\")]\n    Database(#[from] sqlx::Error),\n    #[error(\"Not found: {0}\")]\n    NotFound(String),\n    #[error(\"Forbidden: {0}\")]\n    Forbidden(String),\n    #[error(\"Internal error: {0}\")]\n    Internal(String),\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::models::message::{CreateMessage, Message, UpdateMessage};\n    use chrono::{TimeZone, Utc};\n    use std::sync::Arc;\n\n    #[test]\n    fn test_service_error_is_send_sync() {\n        fn assert_send_sync\u003cT: Send + Sync\u003e() {}\n        assert_send_sync::\u003cServiceError\u003e();\n    }\n\n    #[test]\n    fn test_service_error_display() {\n        let e = ServiceError::NotFound(\"x\".to_string());\n        assert_eq!(e.to_string(), \"Not found: x\");\n\n        let e = ServiceError::Forbidden(\"no\".to_string());\n        assert_eq!(e.to_string(), \"Forbidden: no\");\n\n        let e = ServiceError::Internal(\"oops\".to_string());\n        assert_eq!(e.to_string(), \"Internal error: oops\");\n\n        let e = ServiceError::Database(sqlx::Error::RowNotFound);\n        assert!(e.to_string().starts_with(\"Database error:\"));\n    }\n\n    #[test]\n    fn test_create_message_payload_trimming_behavior_is_in_route_not_here() {\n        let payload = CreateMessage {\n            content: \"  hello  \".to_string(),\n            channel_id: Uuid::new_v4(),\n        };\n        assert_eq!(payload.content, \"  hello  \");\n    }\n\n    #[test]\n    fn test_update_message_payload_content_is_passed_as_is() {\n        let payload = UpdateMessage {\n            content: \"  hi  \".to_string(),\n        };\n        assert_eq!(payload.content, \"  hi  \");\n    }\n\n    #[test]\n    fn test_message_to_response_flags() {\n        let mut m = Message {\n            id: None,\n            message_id: Uuid::new_v4(),\n            content: \"hello\".to_string(),\n            user_id: Uuid "line":165,"address":[],"length":0,"stats":{"Line":0}},{"line":166,"address":[],"length":0,"stats":{"Line":0}},{"line":168,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":86},{"path":["/","home","vincent","T-DEV-600-PAR_12","server","src","modules","mod.rs"],"content":"pub mod auth;\npub mod channel;\npub mod message;\npub mod server;\npub mod user;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","vincent","T-DEV-600-PAR_12","server","src","modules","server","mod.rs"],"content":"pub mod repository;\npub mod route;\npub mod service;","traces":[],"covered":0,"coverable":0},{"path":["/","home","vincent","T-DEV-600-PAR_12","server","src","modules","server","repository.rs"],"content":"use sqlx::{FromRow, PgPool, Postgres, Transaction};\nuse uuid::Uuid;\n\nuse crate::models::server::{Server, UpdateServer};\nuse crate::models::server_member::{ServerMemberRole, ServerMemberResponse};\n\n#[derive(Debug, FromRow)]\nstruct ServerMemberRow {\n    user_id: Uuid,\n    username: String,\n    role: String,\n}\n\n#[derive(Clone)]\npub struct ServerRepository {\n    pool: PgPool,\n}\n\nimpl ServerRepository {\n    pub fn new(pool: PgPool) -\u003e Self {\n        Self { pool }\n    }\n\n    pub async fn create_with_owner(\u0026self, owner_id: Uuid, name: \u0026str) -\u003e Result\u003cServer, sqlx::Error\u003e {\n        let mut tx: Transaction\u003c'_, Postgres\u003e = self.pool.begin().await?;\n\n        let server = self.insert_server_retrying_code(\u0026mut tx, owner_id, name).await?;\n\n        sqlx::query!(\n            r#\"\n            INSERT INTO server_members (server_id, user_id, role)\n            VALUES ($1, $2, 'owner')\n            ON CONFLICT (server_id, user_id) DO NOTHING\n            \"#,\n            server.id,\n            owner_id\n        )\n            .execute(\u0026mut *tx)\n            .await?;\n\n        tx.commit().await?;\n        Ok(server)\n    }\n\n    async fn insert_server_retrying_code(\n        \u0026self,\n        tx: \u0026mut Transaction\u003c'_, Postgres\u003e,\n        owner_id: Uuid,\n        name: \u0026str,\n    ) -\u003e Result\u003cServer, sqlx::Error\u003e {\n        const MAX_TRIES: usize = 5;\n\n        for _ in 0..MAX_TRIES {\n            let id = Uuid::new_v4();\n            let code = crate::models::server::Server::generate_invitation_code();\n\n            let inserted = sqlx::query_as::\u003c_, Server\u003e(\n                r#\"\n                INSERT INTO servers (id, name, owner_id, invitation_code)\n                VALUES ($1, $2, $3, $4)\n                ON CONFLICT (invitation_code) DO NOTHING\n                RETURNING id, name, owner_id, invitation_code, created_at, updated_at\n                \"#,\n            )\n                .bind(id)\n                .bind(name)\n                .bind(owner_id)\n                .bind(code)\n                .fetch_optional(\u0026mut **tx)\n                .await?;\n\n            if let Some(server) = inserted {\n                return Ok(server);\n            }\n        }\n\n        Err(sqlx::Error::Protocol(\n            \"Failed to generate unique invitation_code after retries\".into(),\n        ))\n    }\n\n    pub async fn list_for_user(\u0026self, user_id: Uuid) -\u003e Result\u003cVec\u003cServer\u003e, sqlx::Error\u003e {\n        let servers = sqlx::query_as::\u003c_, Server\u003e(\n            r#\"\n            SELECT s.id, s.name, s.owner_id, s.invitation_code, s.created_at, s.updated_at\n            FROM servers s\n            INNER JOIN server_members sm ON sm.server_id = s.id\n            WHERE sm.user_id = $1\n            ORDER BY s.created_at DESC\n            \"#,\n        )\n            .bind(user_id)\n            .fetch_all(\u0026self.pool)\n            .await?;\n\n        Ok(servers)\n    }\n\n    pub async fn join_by_invitation_code(\u0026self, user_id: Uuid, code: \u0026str) -\u003e Result\u003c(Server, bool), sqlx::Error\u003e {\n        let mut tx: Transaction\u003c'_, Postgres\u003e = self.pool.begin().await?;\n\n        let server = sqlx::query_as::\u003c_, Server\u003e(\n            r#\"\n            SELECT id, name, owner_id, invitation_code, created_at, updated_at\n            FROM servers\n            WHERE invitation_code = $1\n            \"#,\n        )\n            .bind(code)\n            .fetch_one(\u0026mut *tx)\n            .await?;\n\n        let inserted = sqlx::query_scalar::\u003c_, Uuid\u003e(\n            r#\"\n            INSERT INTO server_members (server_id, user_id, role)\n            VALUES ($1, $2, 'member')\n            ON CONFLICT (server_id, user_id) DO NOTHING\n            RETURNING server_id\n            \"#,\n        )\n            .bind(server.id)\n            .bind(user_id)\n            .fetch_optional(\u0026mut *tx)\n            .await?\n            .is_some();\n\n        tx.commit().await?;\n        Ok((server, inserted))\n    }\n\n    pub async fn leave_server(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003c(Server, bool), sqlx::Error\u003e {\n        let mut tx: Transaction\u003c'_, Postgres\u003e = self.pool.begin().await?;\n\n        let server = sqlx::query_as::\u003c_, Server\u003e(\n            r#\"\n            SELECT id, name, owner_id, invitation_code, created_at, updated_at\n            FROM servers\n            WHERE id = $1\n            \"#,\n        )\n            .bind(server_id)\n            .fetch_one(\u0026mut *tx)\n            .await?;\n\n        if server.owner_id == user_id {\n            tx.rollback().await?;\n            return Err(sqlx::Error::Protocol(\"Owner cannot leave their own server\".into()));\n        }\n\n        let affected = sqlx::query!(\n            r#\"\n            DELETE FROM server_members\n            WHERE server_id = $1 AND user_id = $2\n            \"#,\n            server_id,\n            user_id\n        )\n            .execute(\u0026mut *tx)\n            .await?\n            .rows_affected();\n\n        tx.commit().await?;\n        Ok((server, affected \u003e 0))\n    }\n\n    pub async fn is_member(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003cbool, sqlx::Error\u003e {\n        let exists = sqlx::query_scalar::\u003c_, bool\u003e(\n            r#\"\n            SELECT EXISTS(\n              SELECT 1 FROM server_members\n              WHERE server_id = $1 AND user_id = $2\n            )\n            \"#,\n        )\n            .bind(server_id)\n            .bind(user_id)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(exists)\n    }\n\n    pub async fn get_username(\u0026self, user_id: Uuid) -\u003e Result\u003cString, sqlx::Error\u003e {\n        let username = sqlx::query_scalar::\u003c_, String\u003e(\n            r#\"\n            SELECT username\n            FROM users\n            WHERE id = $1\n            \"#,\n        )\n            .bind(user_id)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        Ok(username)\n    }\n\n    pub async fn list_members(\u0026self, server_id: Uuid) -\u003e Result\u003cVec\u003cServerMemberResponse\u003e, sqlx::Error\u003e {\n        let rows = sqlx::query_as::\u003c_, ServerMemberRow\u003e(\n            r#\"\n            SELECT\n                sm.user_id,\n                u.username,\n                sm.role\n            FROM server_members sm\n            INNER JOIN users u ON u.id = sm.user_id\n            WHERE sm.server_id = $1\n            ORDER BY u.username ASC\n            \"#,\n        )\n            .bind(server_id)\n            .fetch_all(\u0026self.pool)\n            .await?;\n\n        let members = rows\n            .into_iter()\n            .filter_map(|r| {\n                let role = match r.role.as_str() {\n                    \"owner\" =\u003e ServerMemberRole::Owner,\n                    \"admin\" =\u003e ServerMemberRole::Admin,\n                    \"member\" =\u003e ServerMemberRole::Member,\n                    _ =\u003e return None,\n                };\n\n                Some(ServerMemberResponse {\n                    user_id: r.user_id,\n                    username: r.username,\n                    role,\n                })\n            })\n            .collect();\n\n        Ok(members)\n    }\n\n    pub async fn get_member_role(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003cServerMemberRole, sqlx::Error\u003e {\n        let role = sqlx::query_scalar::\u003c_, String\u003e(\n            r#\"\n            SELECT role\n            FROM server_members\n            WHERE server_id = $1 AND user_id = $2\n            \"#,\n        )\n            .bind(server_id)\n            .bind(user_id)\n            .fetch_one(\u0026self.pool)\n            .await?;\n\n        ServerMemberRole::try_from(role).map_err(|e| sqlx::Error::Protocol(e.into()))\n    }\n\n    pub async fn update_member_role(\n        \u0026self,\n        server_id: Uuid,\n        user_id: Uuid,\n        role: ServerMemberRole,\n    ) -\u003e Result\u003c(), sqlx::Error\u003e {\n        let res = sqlx::query!(\n            r#\"\n            UPDATE server_members\n            SET role = $3\n            WHERE server_id = $1\n              AND user_id = $2\n              AND role != 'owner'\n            \"#,\n            server_id,\n            user_id,\n            role.as_str()\n        )\n            .execute(\u0026self.pool)\n            .await?;\n\n        if res.rows_affected() == 0 {\n            return Err(sqlx::Error::RowNotFound);\n        }\n\n        Ok(())\n    }\n\n    pub async fn transfer_owner(\n        \u0026self,\n        server_id: Uuid,\n        old_owner_id: Uuid,\n        new_owner_id: Uuid,\n    ) -\u003e Result\u003cServer, sqlx::Error\u003e {\n        let mut tx: Transaction\u003c'_, Postgres\u003e = self.pool.begin().await?;\n\n        let server = sqlx::query_as::\u003c_, Server\u003e(\n            r#\"\n            UPDATE servers\n            SET owner_id = $2,\n                updated_at = NOW()\n            WHERE id = $1\n            RETURNING id, name, owner_id, invitation_code, created_at, updated_at\n            \"#,\n        )\n            .bind(server_id)\n            .bind(new_owner_id)\n            .fetch_one(\u0026mut *tx)\n            .await?;\n\n        sqlx::query!(\n            r#\"\n            UPDATE server_members\n            SET role = 'owner'\n            WHERE server_id = $1 AND user_id = $2\n            \"#,\n            server_id,\n            new_owner_id\n        )\n            .execute(\u0026mut *tx)\n            .await?;\n\n        sqlx::query!(\n            r#\"\n            UPDATE server_members\n            SET role = 'member'\n            WHERE server_id = $1 AND user_id = $2\n            \"#,\n            server_id,\n            old_owner_id\n        )\n            .execute(\u0026mut *tx)\n            .await?;\n\n        tx.commit().await?;\n        Ok(server)\n    }\n\n    pub async fn remove_member(\u0026self, server_id: Uuid, user_id: Uuid) -\u003e Result\u003c(), sqlx::Error\u003e {\n        let res = sqlx::query!(\n            r#\"\n            DELETE FROM server_members\n            WHERE server_id = $1 AND user_id = $2\n            \"#,\n            server_id,\n            user_id\n        )\n            .execute(\u0026self.pool)\n            .await?;\n\n        if res.rows_affected() == 0 {\n            return Err(sqlx::Error::RowNotFound);\n        }\n\n        Ok(())\n    }\n\n    pub async fn find_by_id(\u0026self, server_id: Uuid) -\u003e Result\u003cServer, sqlx::Error\u003e {\n        sqlx::query_as::\u003c_, Server\u003e(\n            r#\"\n            SELECT id, name, owner_id, invitation_code, created_at, updated_at\n            FROM servers\n            WHERE id = $1\n            \"#,\n        )\n            .bind(server_id)\n            .fetch_one(\u0026self.pool)\n            .await\n    }\n\n    pub async fn update(\u0026self, server_id: Uuid, payload: UpdateServer) -\u003e Result\u003cServer, sqlx::Error\u003e {\n        let name = payload.name.map(|s| s.trim().to_string());\n\n        sqlx::query_as::\u003c_, Server\u003e(\n            r#\"\n            UPDATE servers\n            SET\n                name = COALESCE($2, name),\n                updated_at = NOW()\n            WHERE id = $1\n            RETURNING id, name, owner_id, invitation_code, created_at, updated_at\n            \"#,\n        )\n            .bind(server_id)\n            .bind(name)\n            .fetch_one(\u0026self.pool)\n            .await\n    }\n\n    pub async fn delete_server(\u0026self, server_id: Uuid, owner_id: Uuid) -\u003e Result\u003c(), sqlx::Error\u003e {\n        let mut tx: Transaction\u003c'_, Postgres\u003e = self.pool.begin().await?;\n\n        sqlx::query!(r#\"DELETE FROM server_members WHERE server_id = $1\"#, server_id)\n            .execute(\u0026mut *tx)\n            .await?;\n\n        let res = sqlx::query!(\n            r#\"\n            DELETE FROM servers\n            WHERE id = $1 AND owner_id = $2\n            \"#,\n            server_id,\n            owner_id\n        )\n            .execute(\u0026mut *tx)\n            .await?;\n\n        tx.commit().await?;\n\n        if res.rows_affected() == 0 {\n            return Err(sqlx::Error::RowNotFound);\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use chrono::Utc;\n    use sqlx::Row;\n\n    async fn pool_or_skip() -\u003e Option\u003cPgPool\u003e {\n        let url = match std::env::var(\"DATABASE_URL\") {\n            Ok(v) if !v.trim().is_empty() =\u003e v,\n            _ =\u003e {\n                eprintln!(\"SKIP: DATABASE_URL not set (set it to run ServerRepository DB tests)\");\n                return None;\n            }\n        };\n\n        let pool = match PgPool::connect(\u0026url).await {\n            Ok(p) =\u003e p,\n            Err(e) =\u003e {\n                eprintln!(\"SKIP: cannot connect DATABASE_URL: {e}\");\n                return None;\n            }\n        };\n\n        Some(pool)\n    }\n\n    async fn insert_user(pool: \u0026PgPool, user_id: Uuid, username: \u0026str, email: \u0026str) {\n        let _ = sqlx::query(\n            r#\"\n            INSERT INTO users (id, username, email, password_hash, created_at, updated_at)\n            VALUES ($1, $2, $3, 'x', NOW(), NOW())\n            ON CONFLICT (id) DO NOTHING\n            \"#,\n        )\n            .bind(user_id)\n            .bind(username)\n            .bind(email)\n            .execute(pool)\n            .await;\n    }\n\n    async fn cleanup(pool: \u0026PgPool, server_id: Uuid, user_ids: \u0026[Uuid]) {\n        let _ = sqlx::query(\"DELETE FROM server_members WHERE server_id = $1\")\n            .bind(server_id)\n            .execute(pool)\n            .await;\n\n        let _ = sqlx::query(\"DELETE FROM servers WHERE id = $1\")\n            .bind(server_id)\n            .execute(pool)\n            .await;\n\n        for uid in user_ids {\n            let _ = sqlx::query(\"DELETE FROM users WHERE id = $1\")\n                .bind(*uid)\n                .execute(pool)\n                .await;\n        }\n    }\n\n    #[actix_web::test]\n    async fn test_create_with_owner_creates_server_and_owner_member() {\n        let pool = match pool_or_skip().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ServerRepository::new(pool.clone());\n\n        let owner_id = Uuid::new_v4();\n        insert_user(\u0026pool, owner_id, \"repo_owner_u\", \"repo_owner_u@example.com\").await;\n\n        let server = repo.create_with_owner(owner_id, \"repo test server\").await.unwrap();\n        assert_eq!(server.owner_id, owner_id);\n\n        let is_member = repo.is_member(server.id, owner_id).await.unwrap();\n        assert!(is_member);\n\n        let role = repo.get_member_role(server.id, owner_id).await.unwrap();\n        assert!(matches!(role, ServerMemberRole::Owner));\n\n        cleanup(\u0026pool, server.id, \u0026[owner_id]).await;\n    }\n\n    #[actix_web::test]\n    async fn test_join_by_invitation_code_inserts_once_then_returns_false_on_second_join() {\n        let pool = match pool_or_skip().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ServerRepository::new(pool.clone());\n\n        let owner_id = Uuid::new_v4();\n        let user_id = Uuid::new_v4();\n        insert_user(\u0026pool, owner_id, \"repo_owner2\", \"repo_owner2@example.com\").await;\n        insert_user(\u0026pool, user_id, \"repo_user2\", \"repo_user2@example.com\").await;\n\n        let server = repo.create_with_owner(owner_id, \"repo join test\").await.unwrap();\n\n        let (_s, inserted1) = repo\n            .join_by_invitation_code(user_id, \u0026server.invitation_code)\n            .await\n            .unwrap();\n        assert!(inserted1);\n\n        let (_s, inserted2) = repo\n            .join_by_invitation_code(user_id, \u0026server.invitation_code)\n            .await\n            .unwrap();\n        assert!(!inserted2);\n\n        cleanup(\u0026pool, server.id, \u0026[owner_id, user_id]).await;\n    }\n\n    #[actix_web::test]\n    async fn test_leave_server_owner_cannot_leave() {\n        let pool = match pool_or_skip().await {\n            Some(p) =\u003e p,\n            None =\u003e return,\n        };\n\n        let repo = ServerRepository::new(pool.clone());\n\n        let owner_id = Uuid::new_v4();\n        insert_user(\u0026pool, owner_id, \"repo_owner3\", \"repo_owner3@example.com\").await;\n\n        let server = repo.create_with_owner(owner_id, \"repo leave test\").await.unwrap();\n\n        let err = repo.leave_server(server.id, owner_id).await.unwrap_err();\n        match err {\n            sqlx::Error::Protocol(msg) =\u003e assert!(msg.contains(\"Owner cannot leave\")),\n            other =\u003e panic!(\"expected Protocol error, got {other:?}\"),\n        }\n\n        cleanup(\u0026pool, server.id, \u0026[owner_id]).await;\n    }\n\n    #[a ser: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    path: web::Path\u003cuuid::Uuid\u003e,\n    payload: web::Json\u003cUpdateServer\u003e,\n) -\u003e impl Responder {\n    if let Err(e) = payload.validate() {\n        return HttpResponse::BadRequest().json(json!({ \"error\": e.to_string() }));\n    }\n\n    let server_id = path.into_inner();\n\n    match service.update_server(user.user_id, server_id, payload.into_inner()).await {\n        Ok(server) =\u003e HttpResponse::Ok().json(ServerResponse::from(server)),\n        Err(e) if e == \"Forbidden\" =\u003e HttpResponse::Forbidden().json(json!({ \"error\": \"Forbidden\" })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\npub async fn join_server(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    ws: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    payload: web::Json\u003cJoinServerRequest\u003e,\n) -\u003e impl Responder {\n    if let Err(e) = payload.validate() {\n        return HttpResponse::BadRequest().json(json!({ \"error\": e.to_string() }));\n    }\n\n    match service.join_by_invitation_code(user.user_id, \u0026payload.invitation_code).await {\n        Ok(server) =\u003e {\n            let server_id = server.id;\n            let username = service\n                .get_username(user.user_id)\n                .await\n                .unwrap_or_else(|_| \"unknown\".to_string());\n\n            ws.do_send(ServerEvent::MemberJoined {\n                server_id,\n                user_id: user.user_id,\n                username,\n            });\n\n            HttpResponse::Ok().json(ServerResponse::from(server))\n        }\n        Err(JoinServerError::InvalidCode) =\u003e {\n            HttpResponse::BadRequest().json(json!({ \"error\": \"Invalid invitation code.\" }))\n        }\n        Err(JoinServerError::NotFound) =\u003e HttpResponse::NotFound().json(json!({ \"error\": \"Server not found.\" })),\n        Err(JoinServerError::AlreadyMember) =\u003e HttpResponse::Conflict().json(json!({ \"error\": \"Already a member.\" })),\n        Err(JoinServerError::Db) =\u003e {\n            HttpResponse::InternalServerError().json(json!({ \"error\": \"Unable to join server.\" }))\n        }\n    }\n}\n\npub async fn leave_server(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    ws: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    path: web::Path\u003cuuid::Uuid\u003e,\n) -\u003e impl Responder {\n    let server_id = path.into_inner();\n\n    match service.leave_server(server_id, user.user_id).await {\n        Ok(_) =\u003e {\n            let username = service\n                .get_username(user.user_id)\n                .await\n                .unwrap_or_else(|_| \"unknown\".to_string());\n\n            ws.do_send(ServerEvent::MemberLeft {\n                server_id,\n                user_id: user.user_id,\n                username,\n            });\n\n            HttpResponse::Ok().json(json!({ \"message\": \"Serveur quitté avec succès\" }))\n        }\n        Err(LeaveServerError::NotFound) =\u003e HttpResponse::NotFound().json(json!({ \"error\": \"Server not found.\" })),\n        Err(LeaveServerError::AlreadyLeave) =\u003e HttpResponse::Conflict()\n            .json(json!({ \"error\": \"Already leave or member not found.\" })),\n        Err(LeaveServerError::Db) =\u003e {\n            HttpResponse::InternalServerError().json(json!({ \"error\": \"Unable to leave server.\" }))\n        }\n    }\n}\n\npub async fn list_members(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    path: web::Path\u003cuuid::Uuid\u003e,\n) -\u003e impl Responder {\n    let server_id = path.into_inner();\n\n    match service.list_members(user.user_id, server_id).await {\n        Ok(members) =\u003e HttpResponse::Ok().json(members),\n        Err(e) if e == \"Forbidden\" =\u003e HttpResponse::Forbidden().json(json!({ \"error\": \"Forbidden\" })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\n#[derive(Debug, Deserialize)]\npub struct MemberPath {\n    pub id: uuid::Uuid,\n    pub user_id: uuid::Uuid,\n}\n\npub async fn set_member_role(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    ws: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    path: web::Path\u003cMemberPath\u003e,\n    payload: web::Json\u003cUpdateServerMemberRole\u003e,\n) -\u003e impl Responder {\n    if payload.role.as_str() == \"owner\" {\n        return HttpResponse::BadRequest().json(json!({ \"error\": \"Use /transfer-owner endpoint\" }));\n    }\n\n    let server_id = path.id;\n    let target_user_id = path.user_id;\n\n    match service\n        .set_role(user.user_id, server_id, target_user_id, payload.role.clone())\n        .await\n    {\n        Ok(_) =\u003e {\n            let username = service\n                .get_username(target_user_id)\n                .await\n                .unwrap_or_else(|_| \"unknown\".to_string());\n\n            ws.do_send(ServerEvent::MemberRoleUpdated {\n                server_id,\n                user_id: target_user_id,\n                username,\n                role: payload.role.as_str().to_string(),\n            });\n\n            HttpResponse::Ok().json(json!({ \"message\": \"Role updated\" }))\n        }\n        Err(e) if e == \"Forbidden\" =\u003e HttpResponse::Forbidden().json(json!({ \"error\": \"Forbidden\" })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\n#[derive(Debug, Deserialize)]\npub struct TransferOwnerPayload {\n    pub new_owner_id: uuid::Uuid,\n}\n\npub async fn transfer_owner(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    ws: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    path: web::Path\u003cuuid::Uuid\u003e,\n    payload: web::Json\u003cTransferOwnerPayload\u003e,\n) -\u003e impl Responder {\n    let server_id = path.into_inner();\n\n    let old_owner_id = match service.get_server_owner_id(server_id).await {\n        Ok(id) =\u003e id,\n        Err(e) =\u003e return HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    };\n\n    match service\n        .transfer_owner(user.user_id, server_id, payload.new_owner_id)\n        .await\n    {\n        Ok(server) =\u003e {\n            let new_owner_username = service\n                .get_username(payload.new_owner_id)\n                .await\n                .unwrap_or_else(|_| \"unknown\".into());\n\n            ws.do_send(ServerEvent::MemberRoleUpdated {\n                server_id,\n                user_id: payload.new_owner_id,\n                username: new_owner_username,\n                role: \"owner\".into(),\n            });\n\n            let old_owner_username = service\n                .get_username(old_owner_id)\n                .await\n                .unwrap_or_else(|_| \"unknown\".into());\n\n            ws.do_send(ServerEvent::MemberRoleUpdated {\n                server_id,\n                user_id: old_owner_id,\n                username: old_owner_username,\n                role: \"member\".into(),\n            });\n\n            HttpResponse::Ok().json(ServerResponse::from(server))\n        }\n        Err(e) =\u003e HttpResponse::Forbidden().json(json!({ \"error\": e })),\n    }\n}\n\npub async fn kick_member(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    ws: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    path: web::Path\u003cMemberPath\u003e,\n) -\u003e impl Responder {\n    let server_id = path.id;\n    let target_user_id = path.user_id;\n\n    match service.kick_member(user.user_id, server_id, target_user_id).await {\n        Ok(_) =\u003e {\n            let username = service\n                .get_username(target_user_id)\n                .await\n                .unwrap_or_else(|_| \"unknown\".to_string());\n\n            ws.do_send(ServerEvent::MemberKicked {\n                server_id,\n                user_id: target_user_id,\n                username,\n            });\n\n            HttpResponse::Ok().json(json!({ \"message\": \"Member removed\" }))\n        }\n        Err(e) if e == \"Forbidden\" =\u003e HttpResponse::Forbidden().json(json!({ \"error\": \"Forbidden\" })),\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\npub async fn delete_server(\n    user: AuthenticatedUser,\n    service: web::Data\u003cServerService\u003e,\n    ws: web::Data\u003cAddr\u003cWsServer\u003e\u003e,\n    path: web::Path\u003cuuid::Uuid\u003e,\n) -\u003e impl Responder {\n    let server_id = path.into_inner();\n\n    match service.delete_server(server_id, user.user_id).await {\n        Ok(_) =\u003e {\n            ws.do_send(ServerEvent::ServerDeleted { server_id });\n            HttpResponse::Ok().json(json!({ \"message\": \"Serveur supprimé avec succès\" }))\n        }\n        Err(e) =\u003e HttpResponse::BadRequest().json(json!({ \"error\": e })),\n    }\n}\n\npub fn config(cfg: \u0026mut web::ServiceConfig) {\n    cfg.route(\"\", web::post().to(create_server))\n        .route(\"\", web::get().to(list_servers))\n        .route(\"/join\", web::post().to(join_server))\n        .route(\"/{id}/leave\", web::delete().to(leave_server))\n        .route(\"/{id}/members\", web::get().to(list_members))\n        .route(\"/{id}/members/{user_id}/role\", web::patch().to(set_member_role))\n        .route(\"/{id}/members/{user_id}\", web::delete().to(kick_member))\n        .route(\"/{id}/transfer-owner\", web::post().to(transfer_owner))\n        .route(\"/{id}\", web::put().to(update_server))\n        .route(\"/{id}\", web::delete().to(delete_server));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use actix_web::{http::StatusCode, test, web, App};\n\n    fn build_app() -\u003e App\u003c\n        impl actix_web::dev::ServiceFactory\u003c\n            actix_web::dev::ServiceRequest,\n            Config = (),\n            Response = actix_web::dev::ServiceResponse,\n            Error = actix_web::Error,\n            InitError = (),\n        \u003e,\n    \u003e {\n        App::new().service(web::scope(\"/servers\").configure(config))\n    }\n\n    fn assert_method_not_allowed_or_not_found(status: StatusCode) {\n        assert!(status == StatusCode::METHOD_NOT_ALLOWED || status == StatusCode::NOT_FOUND);\n    }\n\n    #[actix_web::test]\n    async fn test_routes_exist_and_unrelated_is_404() {\n        let app = test::init_service(build_app()).await;\n\n        let req = test::TestRequest::get().uri(\"/servers/nope-nope\").to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_eq!(resp.status(), StatusCode::NOT_FOUND);\n    }\n\n    #[actix_web::test]\n    async fn test_wrong_method_on_dynamic_paths_is_not_success() {\n        let app = test::init_service(build_app()).await;\n\n        let sid = uuid::Uuid::new_v4();\n        let uid = uuid::Uuid::new_v4();\n\n        let req = test::TestRequest::post()\n            .uri(\u0026format!(\"/servers/{}/leave\", sid))\n            .to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_method_not_allowed_or_not_found(resp.status());\n\n        let req = test::TestRequest::post()\n            .uri(\u0026format!(\"/servers/{}/members\", sid))\n            .to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_method_not_allowed_or_not_found(resp.status());\n\n        let req = test::TestRequest::get()\n            .uri(\u0026format!(\"/servers/{}/members/{}/role\", sid, uid))\n            .to_request();\n        let resp = test::call_service(\u0026app, req).await;\n        assert_method_not_allowed_or_not_found(resp.status());\n\n        let req = test::TestRequest::get()\n            .uri(\u0026format!(\"/servers/{}/members/{}\", sid, uid))\n            .to
